<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portal Médico y Telegram — Uso completo</title>
<style>
  :root {
    --navy: #081327; --navy-800: #0f2444; --surface: #14294c;
    --teal: #12968a; --teal-light: #4fd1c0; --danger: #e0665f;
    --gold: #c8a050; --gold-light: #e0c185; --purple: #b79ae0;
    --text: #eef2f6; --text-secondary: #a7b4c9; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--navy); color:var(--text); display:flex; justify-content:center; padding:32px 16px; }
  .wrap { width:100%; max-width:660px; }
  .dots { display:flex; gap:3px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--surface); transition:background .3s; }
  .dot.active { background:var(--teal-light); }
  .stage { position:relative; min-height:440px; max-height:660px; overflow-y:auto; background:var(--navy-800); border-radius:20px; padding:30px 28px; }
  .cell { opacity:0; transform:translateX(20px); transition:opacity .35s ease, transform .35s ease; }
  .cell.active { opacity:1; transform:translateX(0); }
  .icon-badge { width:52px; height:52px; border-radius:50%; background:rgba(79,209,192,0.12); display:flex; align-items:center; justify-content:center; margin-bottom:16px; font-size:24px; }
  h3 { margin:0 0 12px; font-size:19px; font-weight:600; color:#fff; }
  h4 { margin:16px 0 6px; font-size:12.5px; font-weight:700; color:var(--gold-light); letter-spacing:0.03em; text-transform:uppercase; }
  p { font-size:14.5px; line-height:1.65; color:var(--text-secondary); margin:0 0 10px; }
  .card { background:var(--surface); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; }
  .card p { margin:0; }
  .step-label { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--teal-light); background:rgba(79,209,192,0.1); border-radius:20px; padding:4px 10px; margin-bottom:10px; }
  .step-label.p2 { color:var(--gold-light); background:rgba(200,160,80,0.1); }
  .step-label.p3 { color:var(--purple); background:rgba(183,154,224,0.1); }
  .chip-row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
  .chip { background:var(--surface); border-radius:20px; padding:7px 12px; font-size:12px; font-weight:600; color:var(--text); }
  .opt { display:block; width:100%; text-align:left; background:var(--surface); color:var(--text); border:1.5px solid transparent; border-radius:10px; padding:11px 14px; font-size:13.5px; margin-bottom:8px; cursor:pointer; }
  .opt:hover { border-color:var(--teal); }
  .opt.correct { border-color:var(--teal-light); color:var(--teal-light); }
  .opt.wrong { border-color:var(--danger); color:var(--danger); }
  .feedback { font-size:13px; margin:8px 0 0; }
  .feedback.ok { color:var(--teal-light); }
  .feedback.bad { color:var(--danger); }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
  button.navbtn { background:var(--teal); color:#04211d; border:none; border-radius:10px; padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer; }
  button.navbtn.secondary { background:transparent; color:var(--text-secondary); border:1px solid var(--surface); }
  button.navbtn:disabled { opacity:0.3; cursor:default; }
  .label { font-size:10.5px; color:var(--text-secondary); letter-spacing:0.04em; text-transform:uppercase; }
  button.retry { background:transparent; border:1px solid var(--teal); color:var(--teal-light); border-radius:8px; padding:7px 14px; font-size:12.5px; margin-top:8px; cursor:pointer; }
  .subcounter { font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .rationale { border-left:2px solid var(--teal); padding-left:12px; margin-top:10px; }
  .nova-btn {
    position: fixed; bottom: 22px; right: 22px; z-index: 999;
    display: flex; align-items: center; gap: 8px;
    background: var(--teal); color: #04211d; text-decoration: none;
    font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px;
    padding: 12px 18px; border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    transition: transform .15s ease;
  }
  .nova-btn:hover { transform: translateY(-2px); }
  @media (max-width: 480px) {
    .nova-btn { bottom: 14px; right: 14px; padding: 10px 14px; font-size: 12px; }
  }
</style>
  <script src="/lib/i18n.js"></script>
</head>
<body>
<a href="/portal-medico.html?nova=1" target="_blank" rel="noopener" class="nova-btn">💬 Preguntar a NOVA</a>
<div class="wrap">
  <div class="dots" id="dots"></div>
  <div class="stage" id="stage"></div>
  <div class="nav">
    <button class="navbtn secondary" id="backBtn">← Anterior</button>

<script>
// Este módulo, al llegar al final, avisa directamente al hub de
// capacitación (vía postMessage) que se completó — así ya no depende de
// que el médico, además de terminar el repaso, se acuerde de darle
// manualmente a un segundo botón "Marcar completado" que vive fuera de
// este iframe. Antes esa desconexión causaba que el progreso se perdiera
// aunque el médico sí hubiera terminado todo.
var MODULO_ID = 5; // Portal Médico, según el registro MODS del hub

var PRACTICE_CASES = [
  { caseText: "Un médico revisa la lista de pacientes y ve que no aparece un paciente que sabe que otro colega de la red sí atiende regularmente.",
    opts: ["Es un error del sistema que hay que reportar de inmediato.", "Es el comportamiento esperado: cada médico solo ve, por diseño, a sus propios pacientes (campo Médico_principal) — para ver el expediente de un paciente de otro colega existe específicamente el campo \"Paciente compartido\".", "Debe pedirle al administrador que le dé acceso total al sistema."], correct: 1,
    rationale: "Esta separación no es un bug — es intencional, para que cada médico trabaje sobre su propia cartera de pacientes por defecto, mientras la interconsulta queda disponible como un flujo aparte y explícito." },
  { caseText: "Un médico quiere que un paciente nuevo llene sus propios datos desde la sala de espera, sin que el médico tenga que capturarlos uno por uno.",
    opts: ["Debe crear manualmente el paciente y compartirle usuario y contraseña del portal.", "Usa el botón \"Link para autorregistro\" — genera un enlace de un solo propósito para que el paciente cree su propio expediente, sin exponer el código de médico ni dar acceso al portal.", "No existe forma de que el paciente se registre solo, siempre lo hace el médico."], correct: 1,
    rationale: "El autorregistro usa un token de un solo propósito, completamente distinto del código de médico — nunca sirve para iniciar sesión en el portal, solo para llenar el formulario inicial de ese paciente específico." },
  { caseText: "Un médico termina de guardar una consulta sin haber escrito un diagnóstico CIE-10 específico, porque no tuvo tiempo de buscarlo.",
    opts: ["El sistema rechaza el guardado hasta que se indique un CIE-10 manualmente.", "La consulta se guarda igual, y NOVA analiza motivo + exploración + patologías activas del paciente para proponer un CIE-10 en segundo plano — marcado como sugerencia, nunca como diagnóstico definitivo.", "El campo queda vacío para siempre y nadie más lo revisa."], correct: 1,
    rationale: "Este apoyo existe precisamente para el escenario real: consulta con poco tiempo, diagnóstico no capturado en el momento. NOVA propone, el médico decide — la palabra final siempre es del médico." },
  { caseText: "Un médico abre el expediente de un paciente y su última consulta no tiene registrada la firma/cédula del médico que la generó.",
    opts: ["El portal no tiene forma de detectar esto, pasa desapercibido.", "Aparece un aviso automático (NOVA revisa completitud contra NOM-004-SSA3-2012 cada vez que se abre un expediente) señalando específicamente ese hueco — sin bloquear el acceso ni el uso normal del expediente.", "El expediente se bloquea por completo hasta corregirlo."], correct: 1,
    rationale: "El auditor de completitud corre automáticamente al abrir cualquier expediente — su función es avisar a tiempo, nunca impedir el trabajo del médico." },
  { caseText: "Un médico, ya vinculado a @Drvirnbot, quiere registrar una consulta rápida desde su celular sin abrir el portal en ese momento.",
    opts: ["Escribe el código del paciente (CC-PAC-XXXXXX) seguido de su dictado en lenguaje natural — el bot interpreta, resume, y solo guarda si el médico confirma con \"sí\".", "Debe enviar una foto de sus notas escritas a mano para que alguien las transcriba después.", "Telegram solo sirve para recibir notificaciones, nunca para dictar nada."], correct: 0,
    rationale: "El dictado por Telegram usa el mismo motor de interpretación que NOVA en el portal, y nunca guarda nada sin la confirmación explícita del médico — es exactamente igual de seguro que llenar el formulario en pantalla." },
  { caseText: "Un paciente le pregunta a NOVA algo que requiere criterio médico real, no un dato administrativo simple.",
    opts: ["NOVA responde lo que considere apropiado sin avisar a nadie más.", "NOVA le avisa automáticamente al médico asignado de ese paciente por Telegram (si ya vinculó su cuenta) — el médico puede responder directo desde ahí, y esa respuesta le llega al paciente en su siguiente conversación con NOVA.", "El paciente debe llamar por teléfono al consultorio para resolverlo."], correct: 1,
    rationale: "Este es uno de los dos disparadores automáticos del sistema de alertas — está diseñado exactamente para no dejar sin respuesta a un paciente que necesita criterio médico, sin que el médico tenga que estar frente al portal en ese momento." },
  { caseText: "Un médico conecta por primera vez su Google Calendar desde el botón del topbar del portal.",
    opts: ["Debe seguir instrucciones específicas construidas por CODE CELLS® paso a paso.", "Un clic lo manda directo a la pantalla de consentimiento estándar de Google — es Google quien guía ese paso a paso, no necesitamos construir nuestra propia versión de ese proceso.", "Requiere llenar un formulario de solicitud y esperar aprobación manual de un administrador."], correct: 1,
    rationale: "Reutilizar el flujo de consentimiento estándar de Google (en vez de construir uno propio) es más simple y más seguro — es una pantalla que millones de personas ya conocen." }
];

var DIFFERENTIAL_CASES = [
  { caseText: "Un médico entiende que, como Telegram puede dictar expedientes, ya no hace falta usar el portal web para nada en el día a día.",
    opts: ["Correcto: Telegram reemplaza por completo al portal, ya no tiene sentido abrirlo.", "Incorrecto: son dos puertas de entrada al mismo expediente, no un reemplazo — el portal ofrece funciones que Telegram no reproduce (exportar PDF, generar receta, editar historia clínica completa, ver gráficas de labs, panel de NOVA). La elección de cuál usar es de conveniencia según el momento, no de sustitución."], correct: 1,
    rationale: "Confundir 'tiene una función parecida' con 'reemplaza por completo' es el error central que este ejercicio busca corregir — cada canal tiene su lugar." },
  { caseText: "Un médico ve que NOVA sugirió un CIE-10 en una consulta y, al ver que 'ya está lleno el campo', asume que ya es el diagnóstico oficial sin revisarlo.",
    opts: ["Correcto: una vez que NOVA lo sugiere y aparece escrito, ya no requiere ninguna revisión adicional.", "Incorrecto: el prefijo \"Sugerido por NOVA\" existe exactamente para señalar que ese valor requiere confirmación o corrección del médico — que el campo ya no esté vacío no significa que el contenido ya sea definitivo."], correct: 1,
    rationale: "Un campo lleno no es lo mismo que un campo confirmado — esa distinción es la que este ejercicio pone a prueba." },
  { caseText: "Un médico recibe el aviso de completitud NOM-004 en un expediente y, al verlo, asume que el sistema le está bloqueando el acceso hasta corregirlo.",
    opts: ["Correcto: el expediente queda inaccesible hasta llenar lo que falta, no se puede seguir trabajando.", "Incorrecto: el aviso es informativo — el médico puede seguir usando el expediente con total normalidad; la responsabilidad de completar los datos sigue siendo suya, el sistema solo se lo recuerda a tiempo, nunca le impide trabajar."], correct: 1,
    rationale: "El auditor de completitud nunca bloquea nada — es el mismo principio que ya rige el resto del sistema: informar activamente, jamás impedir el trabajo clínico." },
  { caseText: "Un médico piensa que, como ya vinculó su Telegram una vez con /start y su código, cualquier mensaje que le llegue de un paciente por WhatsApp también se podría responder desde ese mismo hilo de Telegram.",
    opts: ["Correcto: todos los canales de mensajería quedan unificados automáticamente en uno solo.", "Incorrecto: el mecanismo de \"responder y que la respuesta le llegue al paciente\" es específico de las alertas que el propio sistema genera dentro de Telegram — no es un puente universal hacia mensajes que llegaron por otro canal distinto, como WhatsApp directo."], correct: 1,
    rationale: "El mecanismo de responder-y-entregar depende de un hilo específico creado por el sistema al enviar la alerta original — no conecta canales de mensajería entre sí de forma general." }
];

// ── REPASO (no examen calificado) ─────────────────────────────────
// A diferencia de los módulos de contenido clínico/científico, este es un
// módulo de USO de una herramienta — lo que importa es confirmar que el
// médico entendió cómo usarla, no calificarlo con un porcentaje de
// aprobación. Por eso este bloque no tiene 80% mínimo ni "aprobado/no
// aprobado": cada reactivo da su retroalimentación inmediata y se avanza,
// el objetivo es que el médico refuerce lo que no le quedó claro, no que
// "repruebe" el uso de su propio portal de trabajo.
var REPASO_ITEMS = [
  { q: "¿Por qué cada médico ve, por defecto, solo a sus propios pacientes en la lista?", opts: ["Es un límite técnico que no se puede cambiar", "Para que cada médico trabaje ordenadamente sobre su propia cartera de pacientes — el acceso a pacientes de otros colegas existe aparte, de forma explícita, vía interconsulta", "Porque los pacientes lo solicitan así", "No hay ninguna razón particular"], correct: 1 },
  { q: "¿Cuál es la diferencia real entre el \"Token de autorregistro\" y el \"Código de médico\"?", opts: ["Son lo mismo con nombres distintos", "El token es de un solo propósito (que un paciente específico llene su ficha inicial) y nunca abre el portal — el código de médico sí abre el portal completo", "El token da acceso administrativo total", "El código de médico caduca cada semana"], correct: 1 },
  { q: "¿Para qué está pensado específicamente el campo \"Paciente compartido\"?", opts: ["Para transferir permanentemente a un paciente a otro médico", "Para que cualquier médico de la red pueda consultar puntualmente el expediente de un paciente que no es suyo, en el contexto de una interconsulta real", "Para borrar pacientes duplicados", "Para cambiar el nombre de un paciente"], correct: 1 },
  { q: "¿Por qué el expediente se organiza en 5 pestañas separadas (Datos, Historia, Consultas, Labs, Nutrición) en vez de una sola pantalla?", opts: ["Por capricho de diseño, sin ninguna razón práctica", "Para que cada tipo de información (demográfica, antecedentes, evolución, laboratorio, plan nutricional) se pueda revisar y editar de forma clara, sin mezclar datos de naturaleza distinta en una sola vista", "Porque Airtable obliga a esa separación técnica", "Para que cargue más rápido en celulares antiguos"], correct: 1 },
  { q: "¿Qué gana el médico usando \"⇄ Comparar fechas\" en NOVA Labs, en vez de abrir cada estudio uno por uno?", opts: ["Nada distinto, es solo estético", "Ver la tendencia real de un mismo parámetro a lo largo del tiempo de un vistazo — más útil clínicamente que comparar valores sueltos de memoria", "Acceso a estudios de otros pacientes", "Genera automáticamente un diagnóstico"], correct: 1 },
  { q: "¿Cuándo entra en acción la sugerencia automática de CIE-10 de NOVA?", opts: ["Solo si el médico la pide expresamente cada vez, nunca sola", "Automáticamente, cada vez que se guarda una consulta (desde el portal o desde Telegram) sin que el médico haya escrito ya un diagnóstico explícito", "Una sola vez al mes, sin importar cuántas consultas haya", "Nunca, es completamente manual"], correct: 1 },
  { q: "¿Por qué el campo de CIE-10 sugerido por NOVA lleva el prefijo \"Sugerido por NOVA\" en vez de guardarse tal cual?", opts: ["Por estética únicamente, sin ninguna función real", "Para que sea imposible confundirlo con un diagnóstico ya confirmado por el médico — obliga a una revisión consciente antes de tratarlo como definitivo", "Porque así lo exige Airtable técnicamente", "Es un error de programación que se va a corregir después"], correct: 1 },
  { q: "¿Qué hace el sistema cuando detecta, al abrir un expediente, que la consulta más reciente no tiene registrada la firma/cédula del médico?", opts: ["Elimina esa consulta automáticamente", "Bloquea el expediente por completo hasta corregirlo", "Muestra un aviso informativo señalando específicamente ese hueco, sin impedir que el médico siga trabajando con normalidad", "Nada, no hay forma de detectarlo"], correct: 2 },
  { q: "¿Qué necesita un médico para conectar su Google Calendar desde el portal?", opts: ["Escribir su contraseña de Gmail directamente en el portal", "Un clic en el botón del topbar, seguido de la pantalla de consentimiento estándar que Google ya diseñó para este propósito", "Instalar una aplicación aparte en su celular", "Pedirle a un administrador que lo conecte por él"], correct: 1 },
  { q: "Si un médico no ha conectado su Google Calendar, ¿qué pasa cuando NOVA necesitaría agendar algo ahí?", opts: ["El sistema completo deja de funcionar para ese médico", "NOVA simplemente no ofrece esa función puntual, sin generar ningún error visible para el paciente", "Se le cobra una penalización", "El paciente recibe un mensaje de error confuso"], correct: 1 },
  { q: "¿Cómo se vincula, por primera y única vez, la cuenta de Telegram de un médico con el sistema?", opts: ["Buscando @Drvirnbot, enviando /start, y después el código CCMED-XXXXXX propio", "Automáticamente, sin que el médico haga nada", "Compartiendo su contraseña del portal directamente al bot", "Solo un administrador puede vincular cuentas de médicos"], correct: 0 },
  { q: "Una vez vinculada la cuenta, ¿qué tipo de cosas le empiezan a llegar automáticamente al médico por Telegram?", opts: ["Solo mensajes publicitarios genéricos", "Notificaciones de certificación, recordatorios del Diplomado, y avisos que el propio sistema (NOVA) decide enviar según lo que ocurra con sus pacientes", "Mensajes de pacientes de otros médicos sin ningún filtro", "Nada, hay que activarlo aparte cada vez que se quiera recibir algo"], correct: 1 },
  { q: "¿Qué es exactamente lo que hace que un dictado por Telegram quede guardado en el expediente del paciente?", opts: ["Se guarda automáticamente en cuanto el médico termina de escribir el dictado, sin ningún paso adicional", "El médico debe responder \"sí\" después de revisar el resumen que el bot le presenta — sin esa confirmación explícita, nada se guarda", "Se guarda solo si el paciente también lo aprueba por su cuenta", "Requiere enviar el dictado exactamente tres veces seguidas"], correct: 1 },
  { q: "¿Qué logra un médico usando la función \"Responder\" (reply) de Telegram sobre una alerta de un paciente específico?", opts: ["Nada distinto de escribir un mensaje nuevo cualquiera", "Que su respuesta se entregue automáticamente a ese paciente en su siguiente conversación con NOVA, sin que el médico tenga que entrar al portal para cerrar ese ciclo", "Solo funciona si el paciente está conectado a Telegram también", "Elimina la alerta original sin dejar registro"], correct: 1 },
  { q: "¿Cuáles son, en concreto, los dos motivos que hacen que el sistema le avise automáticamente algo a un médico por Telegram?", opts: ["Solo cuando el administrador lo autoriza manualmente cada vez, uno por uno", "Que un paciente pregunte algo que NOVA considere que requiere criterio médico real, o que otro médico le pida a NOVA avisarle algo a un colega de la red", "Únicamente cuando ocurre un error técnico del sistema", "Solo los lunes, como resumen semanal fijo"], correct: 1 },
  { q: "¿Por qué el portal y Telegram se describen como \"dos puertas al mismo expediente\" y no como dos sistemas separados?", opts: ["Porque cualquier acción hecha en uno (dictar una consulta, por ejemplo) termina en exactamente el mismo lugar (el expediente real del paciente) que si se hubiera hecho desde el otro", "Porque comparten la misma contraseña de acceso", "Porque visualmente se ven idénticos", "No hay ninguna relación real entre ambos"], correct: 0 }
];

var CELLS = [
  { label: "Bienvenida", render: function() {
    return '<div class="icon-badge">🖥️</div><h3>Portal Médico y Telegram</h3>' +
      '<p>Este módulo es distinto a los demás: no es biología ni evidencia clínica — es el <strong style="color:#fff;">manual de uso real</strong> de las dos herramientas con las que trabajas todos los días: el Portal Médico (web) y el bot de Telegram.</p>' +
      '<div class="card"><p style="font-weight:600;color:#fff;margin-bottom:4px;">¿Por qué existe este módulo?</p>' +
      '<p style="margin:0;">Porque el portal tiene más funciones de las que la mayoría usa — interconsultas, receta, PDF, un asistente que ayuda a completar el expediente conforme a la norma oficial (NOM-004-SSA3-2012), y un canal completo por Telegram que muchos médicos ni siquiera saben que pueden usar. Este módulo es para que uses el portal al 100% de su capacidad, no solo la mitad.</p></div>' +
      '<div class="card" style="border-left:3px solid var(--gold-light);"><p style="margin:0;"><strong style="color:#fff;">Este módulo no tiene examen calificado.</strong> Al final hay un repaso — preguntas con retroalimentación inmediata para reforzar lo que no haya quedado claro, sin porcentaje de aprobación. Lo que importa aquí es que sepas usarlo, no que "pases" un examen sobre un botón.</p></div>';
  }},
  { label: "Login y sesión", render: function() {
    return '<div class="icon-badge">🔐</div><span class="step-label">Acceso</span><h3>Iniciar sesión</h3>' +
      '<p>Entras con tu código personal (formato CCMED-XXXXXX). El sistema lo valida contra la base real de médicos y, si es correcto, te da una sesión activa de <strong style="color:#fff;">6 horas</strong>.</p>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">¿Por qué 6 horas y no una sesión infinita?</strong> Es un balance entre seguridad (una sesión no debe durar para siempre, sobre todo en equipos compartidos) y comodidad (no te pide el código cada 10 minutos durante tu jornada).</p></div>' +
      '<p style="margin:0;">Si el navegador ya te reconoce como "dispositivo recordado" (hasta 90 días), el acceso es automático — con el botón <strong style="color:#fff;">"No soy yo — usar otro código"</strong> para cambiar de cuenta si el equipo lo comparten varios médicos.</p>';
  }},
  { label: "El topbar", render: function() {
    return '<div class="icon-badge">🧭</div><span class="step-label">Acceso</span><h3>Los controles que siempre están ahí</h3>' +
      '<div class="chip-row"><span class="chip">☀/🌙 Tema</span><span class="chip">📅 Calendar</span><span class="chip">NOVA</span><span class="chip">Capacitación</span><span class="chip">Timer de sesión</span><span class="chip">Salir</span></div>' +
      '<p>El temporizador de sesión no es decorativo — te muestra en tiempo real cuánto te queda antes de que tengas que volver a iniciar sesión, para que nunca te agarre a media consulta.</p>' +
      '<p style="margin:0;"><strong style="color:#fff;">"Salir" solo cierra tu sesión activa</strong> — no borra el "dispositivo recordado" del equipo. Si quieres que el equipo deje de recordarte, es un paso distinto (ver Login y sesión).</p>';
  }},
  { label: "El selector inicial", render: function() {

    var html = '<div class="icon-badge">🔎</div><h3>Repaso</h3><p class="subcounter">Punto ' + (idx+1) + ' de ' + REPASO_ITEMS.length + '</p><div class="card"><p style="margin:0;font-weight:600;color:#fff;">' + qu.q + '</p></div>';
    qu.opts.forEach(function(o,i){ var cls="opt"; if(answered!==undefined){ if(i===qu.correct) cls+=" correct"; else if(i===answered) cls+=" wrong"; } html += '<button class="'+cls+'" onclick="pickQuiz('+i+')">'+o+'</button>'; });
    if(answered!==undefined){ var ok=answered===qu.correct; html += '<p class="feedback '+(ok?"ok":"bad")+'">'+(ok?"Correcto.":"La respuesta correcta está marcada — vale la pena regresar a esa pantalla si quieres repasarla.")+'</p><button class="retry" onclick="nextQuizQuestion()">'+(idx===REPASO_ITEMS.length-1?"Terminar repaso":"Siguiente →")+'</button>'; }
    return html;
  }},
  { label: "Resumen", render: function(st) {
    return '<div class="icon-badge">🏁</div><h3>Resumen y siguiente paso</h3>' +
      '<ul style="padding-left:18px;font-size:13.5px;color:var(--text-secondary);line-height:1.8;margin-bottom:1rem;">' +
      '<li>El portal y Telegram son dos puertas al mismo expediente — no sistemas competidores, la elección es de conveniencia según el momento.</li>' +
      '<li>NOVA ahora sugiere CIE-10 automáticamente (siempre marcado como sugerencia, nunca definitivo) y audita completitud contra NOM-004 al abrir cada expediente (informa, nunca bloquea).</li>' +
      '<li>Telegram permite dictar expedientes completos, generar planes nutricionales, y responder directo a pacientes — todo sin abrir el portal.</li>' +
      '<li>Nada de esto reemplaza tu criterio clínico — todo es apoyo, la decisión sigue siendo siempre tuya.</li>' +
      '</ul>' +
      '<div class="card"><p style="margin:0;">Este módulo se completó automáticamente al llegar aquí — no necesitas hacer nada más además de cerrar la ventana cuando quieras.</p></div>';
  }}
];

var state = { current: 0, practiceIndex: 0, practiceAnswers: {}, diffIndex: 0, diffAnswers: {}, quizIndex: 0, quizAnswers: {} };
var yaAvisoCompletado = false;
function renderDots(){ var dots=document.getElementById("dots"); dots.innerHTML=""; CELLS.forEach(function(c,i){ var d=document.createElement("div"); d.className="dot"+(i===state.current?" active":""); dots.appendChild(d); }); }
function renderStage(){
  var stage=document.getElementById("stage");
  stage.innerHTML='<div class="cell active">'+CELLS[state.current].render(state)+'</div>';
  document.getElementById("cellLabel").textContent = (state.current+1) + " · " + CELLS[state.current].label;
  document.getElementById("backBtn").disabled=state.current===0;
  var nextBtn=document.getElementById("nextBtn"); var blocked=false;
  if(CELLS[state.current].label==="Práctica") blocked=!(state.practiceIndex===PRACTICE_CASES.length-1 && state.practiceAnswers[PRACTICE_CASES.length-1]!==undefined);
  else if(CELLS[state.current].label==="Diagnóstico diferencial") blocked=!(state.diffIndex===DIFFERENTIAL_CASES.length-1 && state.diffAnswers[DIFFERENTIAL_CASES.length-1]!==undefined);
  else if(CELLS[state.current].label==="Repaso") blocked=state.quizIndex<REPASO_ITEMS.length;
  nextBtn.disabled=blocked;
  nextBtn.textContent = state.current===CELLS.length-1 ? "Reiniciar módulo" : (blocked?"Completa esta parte para continuar":"Siguiente →");
  renderDots();
  stage.scrollTop = 0;

  // Al llegar al Resumen (o sea: ya se completó el repaso completo), se
  // avisa UNA VEZ al hub de capacitación — así el progreso se guarda solo,
  // sin depender de que el médico recuerde darle a un botón aparte fuera
  // de este módulo antes de cerrar la ventana.
  if (CELLS[state.current].label === "Resumen" && !yaAvisoCompletado) {
    yaAvisoCompletado = true;
    try {
      window.parent.postMessage({ tipo: 'code_cells_modulo_completado', moduloId: MODULO_ID }, '*');
    } catch (e) {}
  }
}
function pickPractice(i){ var idx=state.practiceIndex; if(state.practiceAnswers[idx]!==undefined) return; state.practiceAnswers[idx]=i; renderStage(); }
function nextPracticeCase(){ state.practiceIndex++; renderStage(); }
function pickDiff(i){ var idx=state.diffIndex; if(state.diffAnswers[idx]!==undefined) return; state.diffAnswers[idx]=i; renderStage(); }
function nextDiffCase(){ state.diffIndex++; renderStage(); }
function pickQuiz(i){ var idx=state.quizIndex; if(state.quizAnswers[idx]!==undefined) return; state.quizAnswers[idx]=i; renderStage(); }
function nextQuizQuestion(){ state.quizIndex++; renderStage(); }
document.getElementById("backBtn").onclick=function(){ if(state.current>0){ state.current--; renderStage(); } };
document.getElementById("nextBtn").onclick=function(){ if(state.current<CELLS.length-1){ state.current++; renderStage(); } else { state={current:0,practiceIndex:0,practiceAnswers:{},diffIndex:0,diffAnswers:{},quizIndex:0,quizAnswers:{}}; yaAvisoCompletado=false; renderStage(); } };
renderStage();
</script>
</body>
</html>
