<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Portal Médico y Telegram — Uso completo</title>
<style>
  :root {
    --navy: #081327; --navy-800: #0f2444; --surface: #14294c;
    --teal: #12968a; --teal-light: #4fd1c0; --danger: #e0665f;
    --gold: #c8a050; --gold-light: #e0c185; --purple: #b79ae0;
    --text: #eef2f6; --text-secondary: #a7b4c9; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--navy); color:var(--text); display:flex; justify-content:center; padding:32px 16px; }
  .wrap { width:100%; max-width:660px; }
  .dots { display:flex; gap:4px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--surface); transition:background .3s; }
  .dot.active { background:var(--teal-light); }
  .stage { position:relative; min-height:420px; max-height:640px; overflow-y:auto; background:var(--navy-800); border-radius:20px; padding:30px 28px; }
  .cell { opacity:0; transform:translateX(20px); transition:opacity .35s ease, transform .35s ease; }
  .cell.active { opacity:1; transform:translateX(0); }
  .icon-badge { width:52px; height:52px; border-radius:50%; background:rgba(79,209,192,0.12); display:flex; align-items:center; justify-content:center; margin-bottom:16px; font-size:24px; }
  h3 { margin:0 0 12px; font-size:19px; font-weight:600; color:#fff; }
  h4 { margin:16px 0 6px; font-size:12.5px; font-weight:700; color:var(--gold-light); letter-spacing:0.03em; text-transform:uppercase; }
  p { font-size:14.5px; line-height:1.65; color:var(--text-secondary); margin:0 0 10px; }
  .card { background:var(--surface); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; }
  .card p { margin:0; }
  .step-label { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--teal-light); background:rgba(79,209,192,0.1); border-radius:20px; padding:4px 10px; margin-bottom:10px; }
  .step-label.p2 { color:var(--gold-light); background:rgba(200,160,80,0.1); }
  .step-label.p3 { color:var(--purple); background:rgba(183,154,224,0.1); }
  .chip-row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
  .chip { background:var(--surface); border-radius:20px; padding:7px 12px; font-size:12px; font-weight:600; color:var(--text); }
  .protocard { background:var(--surface); border-left:3px solid var(--teal-light); border-radius:8px; padding:10px 14px; margin-bottom:8px; }
  .protocard .pname { font-weight:700; color:#fff; font-size:13.5px; margin-bottom:4px; }
  .protocard .pcomp { font-size:12.5px; color:var(--text-secondary); margin-bottom:4px; }
  .opt { display:block; width:100%; text-align:left; background:var(--surface); color:var(--text); border:1.5px solid transparent; border-radius:10px; padding:11px 14px; font-size:13.5px; margin-bottom:8px; cursor:pointer; }
  .opt:hover { border-color:var(--teal); }
  .opt.correct { border-color:var(--teal-light); color:var(--teal-light); }
  .opt.wrong { border-color:var(--danger); color:var(--danger); }
  .feedback { font-size:13px; margin:8px 0 0; }
  .feedback.ok { color:var(--teal-light); }
  .feedback.bad { color:var(--danger); }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
  button.navbtn { background:var(--teal); color:#04211d; border:none; border-radius:10px; padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer; }
  button.navbtn.secondary { background:transparent; color:var(--text-secondary); border:1px solid var(--surface); }
  button.navbtn:disabled { opacity:0.3; cursor:default; }
  .label { font-size:10.5px; color:var(--text-secondary); letter-spacing:0.04em; text-transform:uppercase; }
  button.retry { background:transparent; border:1px solid var(--teal); color:var(--teal-light); border-radius:8px; padding:7px 14px; font-size:12.5px; margin-top:8px; cursor:pointer; }
  .subcounter { font-size:12px; color:var(--text-secondary); margin-bottom:6px; }
  .rationale { border-left:2px solid var(--teal); padding-left:12px; margin-top:10px; }
  .nova-btn {
    position: fixed; bottom: 22px; right: 22px; z-index: 999;
    display: flex; align-items: center; gap: 8px;
    background: var(--teal); color: #04211d; text-decoration: none;
    font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px;
    padding: 12px 18px; border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    transition: transform .15s ease;
  }
  .nova-btn:hover { transform: translateY(-2px); }
  @media (max-width: 480px) {
    .nova-btn { bottom: 14px; right: 14px; padding: 10px 14px; font-size: 12px; }
  }
</style>
</head>

  { label: "Expediente: Nutrición", render: function() {

  { label: "NOVA dentro del portal", render: function() {

      '<p>El botón NOVA del topbar abre un panel de chat sin salir de la pantalla actual — consultar protocolos, dosis, o pedirle acciones sin cambiar de pestaña ni perder contexto.</p>';
  }},
  { label: "Google Calendar: conexión", render: function() {
    return '<div class="icon-badge">📅</div><h3>Cómo se conecta</h3>' +
      '<p>Un clic en el botón del topbar abre la pantalla estándar de consentimiento de Google.</p>' +
      '<div class="card"><p style="margin:0;">Google guía ese paso a paso — nosotros no necesitamos explicarlo. Al aceptar, el token se guarda automáticamente en el perfil del médico.</p></div>';

  { label: "Google Calendar: qué habilita", render: function() {

  }},
  { label: "Telegram: por qué existe", render: function() {

      '<p>El portal requiere sentarte frente a una pantalla. <strong style="color:#fff;">@Drvirnbot</strong> permite atender lo esencial desde el celular, en segundos, sin abrir el portal.</p>';
  }},
  { label: "Telegram: vincular tu cuenta", render: function() {
    return '<div class="icon-badge">🔗</div><span class="step-label p2">Canal de Telegram</span><h3>Una sola vez</h3>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">1.</strong> Buscar @Drvirnbot.<br><strong style="color:#fff;">2.</strong> Enviar /start.<br><strong style="color:#fff;">3.</strong> Enviar tu código CCMED-XXXXXX.<br><strong style="color:#fff;">4.</strong> El bot confirma y explica los comandos.</p></div>' +
      '<p style="margin:0;">A partir de aquí, tu cuenta queda ligada permanentemente.</p>';
  }},
  { label: "Telegram: qué llega automático", render: function() {

      '<p>Notificaciones de certificación, recordatorios del Diplomado (90/30/7 días antes), y avisos que NOVA decide enviar.</p>';
  }},
  { label: "Telegram: dictar expediente", render: function() {

      '<p>Escribe el código del paciente (CC-PAC-XXXXXX) seguido de tu dictado en lenguaje natural — "paciente refiere dolor lumbar de 3 días...".</p>' +

  { label: "Telegram: confirmar el dictado", render: function() {
    return '<div class="icon-badge">✅</div><span class="step-label p2">Canal de Telegram</span><h3>Nada se guarda sin confirmar</h3>' +
      '<p>Si el resumen es correcto, respondes <strong style="color:#fff;">"sí"</strong> y se guarda en Consultas, Historia Clínica y NOVA Labs — igual que el formulario del portal.</p>' +
      '<div class="card"><p style="margin:0;">Si algo está mal, mandas la corrección en vez de "sí". Es seguro experimentar antes de confirmar.</p></div>';
  }},
  { label: "Telegram: plan nutricional", render: function() {
    return '<div class="icon-badge">🥗</div><span class="step-label p2">Canal de Telegram</span><h3>Generar plan por Telegram</h3>' +
      '<p>Escribe <strong style="color:#fff;">"plan"</strong> + datos del paciente (peso, talla, diagnósticos, objetivo).</p>' +
      '<div class="card"><p style="margin:0;">Recibes un plan de 7 días, firmado con tu nombre y cédula, listo para reenviar.</p></div>';
  }},
  { label: "Telegram: responder a un paciente", render: function() {
    return '<div class="icon-badge">↩️</div><span class="step-label p2">Canal de Telegram</span><h3>Cerrar el ciclo sin el portal</h3>' +
      '<p>Ante una alerta ligada a un paciente, usa <strong style="color:#fff;">"Responder"</strong> (mantener presionado el mensaje → Responder).</p>' +

  }},
  { label: "Telegram: cuándo avisa el sistema", render: function() {
    return '<div class="icon-badge">📡</div><span class="step-label p2">Canal de Telegram</span><h3>Dos disparadores</h3>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">1.</strong> Un paciente pregunta algo que NOVA considera que requiere criterio médico real.<br><strong style="color:#fff;">2.</strong> Un médico le pide a NOVA avisar a un colega de la red.</p></div>' +
      '<p style="margin:0;">Ambos exigen que el destinatario ya haya vinculado su cuenta.</p>';
  }},
  { label: "Telegram: buenas prácticas", render: function() {
    return '<div class="icon-badge">⚠️</div><span class="step-label p2">Canal de Telegram</span><h3>Reglas simples</h3>' +
      '<p style="font-size:12.5px;">El bot es exclusivo de médicos — no compartir el código CCMED- con nadie. Revisar siempre el resumen antes de confirmar un dictado. El sistema ignora mensajes duplicados automáticamente.</p>';
  }},
  { label: "Portal y Telegram: mismo destino", render: function() {
    return '<div class="icon-badge">🎯</div><h3>No son sistemas separados</h3>' +
      '<p>Son dos puertas de entrada al mismo expediente. Un dictado por Telegram termina en el mismo lugar que un formulario del portal.</p>' +
      '<div class="card"><p style="margin:0;">Frente a una computadora, usa el portal. En movimiento, usa Telegram. Es elección de conveniencia, no de reemplazo.</p></div>';
  }},
  { label: "Ejemplo guiado", render: function() {
    return '<div class="icon-badge">🩺</div><h3>Ejemplo guiado</h3>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Caso:</strong> Médico en movimiento recibe un mensaje de paciente pidiendo valoración; después necesita registrar una consulta rápida de otro paciente.</p></div>' +
      '<p><strong style="color:#fff;">1 — Alerta por Telegram.</strong> Llega el aviso porque NOVA detectó que el paciente necesita criterio médico real.</p>' +
      '<p><strong style="color:#fff;">2 — Responder directo.</strong> Usa "Responder" sobre ese mensaje — el paciente lo recibe en su siguiente charla con NOVA.</p>' +
      '<p><strong style="color:#fff;">3 — Dictar la otra consulta.</strong> Escribe el código CC-PAC- + su dictado, confirma con "sí".</p>' +
      '<p style="margin:0;"><strong style="color:#fff;">4 — NOVA de fondo.</strong> Como no dictó un CIE-10 específico, NOVA sugiere uno — pendiente de confirmar la próxima vez que abra el portal.</p>';
  }},
  { label: "Práctica", render: function(st) {
    var idx = st.practiceIndex || 0; var c = PRACTICE_CASES[idx]; var answered = st.practiceAnswers[idx];
    var html = '<div class="icon-badge">✏️</div><h3>Práctica clínica</h3><p class="subcounter">Caso ' + (idx+1) + ' de ' + PRACTICE_CASES.length + '</p><div class="card"><p style="margin:0;">' + c.caseText + '</p></div>';
    c.opts.forEach(function(o,i){ var cls="opt"; if(answered!==undefined){ if(i===c.correct) cls+=" correct"; else if(i===answered) cls+=" wrong"; } html += '<button class="'+cls+'" onclick="pickPractice('+i+')">'+o+'</button>'; });
    if(answered!==undefined){ var ok=answered===c.correct; html += '<p class="feedback '+(ok?"ok":"bad")+'">'+(ok?"Correcto.":"No es correcto.")+'</p><p class="rationale">'+c.rationale+'</p>';
      if(idx<PRACTICE_CASES.length-1) html += '<button class="retry" onclick="nextPracticeCase()">Siguiente caso →</button>';
      else html += '<p style="font-size:13px;color:var(--teal-light);margin-top:10px;">Terminaste los casos de práctica. Continúa al diagnóstico diferencial.</p>'; }
    return html;
  }},
  { label: "Diagnóstico diferencial", render: function(st) {
    var idx = st.diffIndex || 0; var c = DIFFERENTIAL_CASES[idx]; var answered = st.diffAnswers[idx];
    var html = '<div class="icon-badge">🔍</div><h3>Cuando dos ideas compiten</h3><p class="subcounter">Caso ' + (idx+1) + ' de ' + DIFFERENTIAL_CASES.length + '</p><div class="card"><p style="margin:0;">' + c.caseText + '</p></div>';
    c.opts.forEach(function(o,i){ var cls="opt"; if(answered!==undefined){ if(i===c.correct) cls+=" correct"; else if(i===answered) cls+=" wrong"; } html += '<button class="'+cls+'" onclick="pickDiff('+i+')">'+o+'</button>'; });
    if(answered!==undefined){ var ok=answered===c.correct; html += '<p class="feedback '+(ok?"ok":"bad")+'">'+(ok?"Correcto.":"No es correcto.")+'</p><p class="rationale">'+c.rationale+'</p>';
      if(idx<DIFFERENTIAL_CASES.length-1) html += '<button class="retry" onclick="nextDiffCase()">Siguiente caso →</button>';
      else html += '<p style="font-size:13px;color:var(--teal-light);margin-top:10px;">Terminaste el diagnóstico diferencial.</p>'; }
    return html;
  }},
  { label: "Evaluación", render: function(st) {
    var idx = st.quizIndex || 0;
    if (idx >= QUESTIONS.length) {
      var correct=0; QUESTIONS.forEach(function(qu,qi){ if(st.quizAnswers[qi]===qu.correct) correct++; });
      var pct = Math.round((correct/QUESTIONS.length)*100); var passed = pct>=80;
      return '<div class="icon-badge">✅</div><h3>Resultado de la evaluación</h3><div class="card"><p style="font-size:32px;font-weight:700;margin:0 0 6px;color:'+(passed?"var(--teal-light)":"var(--danger)")+';">'+pct+'%</p><p style="margin:0;">'+correct+' de '+QUESTIONS.length+' correctas — '+(passed?"Aprobado (mínimo 80%)":"No aprobado, se requiere 80% o más")+'</p></div>' + (passed?"":'<button class="retry" onclick="restartQuiz()">Reintentar evaluación completa</button>');
    }
    var qu = QUESTIONS[idx]; var answered = st.quizAnswers[idx];
    var html = '<div class="icon-badge">✅</div><h3>Evaluación</h3><p class="subcounter">Reactivo ' + (idx+1) + ' de ' + QUESTIONS.length + '</p><div class="card"><p style="margin:0;font-weight:600;color:#fff;">' + qu.q + '</p></div>';
    qu.opts.forEach(function(o,i){ var cls="opt"; if(answered!==undefined){ if(i===qu.correct) cls+=" correct"; else if(i===answered) cls+=" wrong"; } html += '<button class="'+cls+'" onclick="pickQuiz('+i+')">'+o+'</button>'; });
    if(answered!==undefined){ var ok=answered===qu.correct; html += '<p class="feedback '+(ok?"ok":"bad")+'">'+(ok?"Correcto.":"Incorrecto — la respuesta correcta está marcada.")+'</p><button class="retry" onclick="nextQuizQuestion()">'+(idx===QUESTIONS.length-1?"Ver resultado":"Siguiente reactivo →")+'</button>'; }
    return html;
  }},
  { label: "Resumen", render: function(st) {
    var correct=0; QUESTIONS.forEach(function(qu,qi){ if(st.quizAnswers[qi]===qu.correct) correct++; });
    var pct = Math.round((correct/QUESTIONS.length)*100) || 0; var passed = pct>=80;
    return '<div class="icon-badge">🏁</div><h3>Resumen y siguiente paso</h3>' +
      '<ul style="padding-left:18px;font-size:13.5px;color:var(--text-secondary);line-height:1.8;margin-bottom:1rem;">' +
      '<li>El portal y Telegram son dos puertas al mismo expediente — no sistemas competidores.</li>' +
      '<li>NOVA ahora sugiere CIE-10 automáticamente (siempre marcado como sugerencia) y audita completitud NOM-004 al abrir cada expediente.</li>' +
      '<li>Telegram permite dictar expedientes completos, generar planes nutricionales, y responder directo a pacientes — todo sin abrir el portal.</li>' +
      '<li>Nada de esto bloquea al médico — todo es apoyo, la decisión clínica sigue siendo siempre suya.</li>' +
      '</ul>' +
      '<div class="card"><p style="font-weight:600;margin:0 0 4px;color:'+(passed?"var(--teal-light)":"var(--danger)")+';">Tu resultado: '+pct+'% — '+(passed?"módulo aprobado":"no aprobado, reintenta la evaluación")+'</p>' +
      '<p style="margin:8px 0 0;">Siguiente módulo sugerido: Examen Integrador.</p></div>';
  }}
];

var state = { current: 0, practiceIndex: 0, practiceAnswers: {}, diffIndex: 0, diffAnswers: {}, quizIndex: 0, quizAnswers: {} };
function renderDots(){ var dots=document.getElementById("dots"); dots.innerHTML=""; CELLS.forEach(function(c,i){ var d=document.createElement("div"); d.className="dot"+(i===state.current?" active":""); dots.appendChild(d); }); }
function renderStage(){
  var stage=document.getElementById("stage");
  stage.innerHTML='<div class="cell active">'+CELLS[state.current].render(state)+'</div>';
  document.getElementById("cellLabel").textContent = (state.current+1) + " · " + CELLS[state.current].label;
  document.getElementById("backBtn").disabled=state.current===0;
  var nextBtn=document.getElementById("nextBtn"); var blocked=false;
  if(CELLS[state.current].label==="Práctica") blocked=!(state.practiceIndex===PRACTICE_CASES.length-1 && state.practiceAnswers[PRACTICE_CASES.length-1]!==undefined);
  else if(CELLS[state.current].label==="Diagnóstico diferencial") blocked=!(state.diffIndex===DIFFERENTIAL_CASES.length-1 && state.diffAnswers[DIFFERENTIAL_CASES.length-1]!==undefined);
  else if(CELLS[state.current].label==="Evaluación") blocked=state.quizIndex<QUESTIONS.length;
  nextBtn.disabled=blocked;
  nextBtn.textContent = state.current===CELLS.length-1 ? "Reiniciar módulo" : (blocked?"Completa los casos para continuar":"Siguiente →");
  renderDots();
  stage.scrollTop = 0;
}
function pickPractice(i){ var idx=state.practiceIndex; if(state.practiceAnswers[idx]!==undefined) return; state.practiceAnswers[idx]=i; renderStage(); }
function nextPracticeCase(){ state.practiceIndex++; renderStage(); }
function pickDiff(i){ var idx=state.diffIndex; if(state.diffAnswers[idx]!==undefined) return; state.diffAnswers[idx]=i; renderStage(); }
function nextDiffCase(){ state.diffIndex++; renderStage(); }
function pickQuiz(i){ var idx=state.quizIndex; if(state.quizAnswers[idx]!==undefined) return; state.quizAnswers[idx]=i; renderStage(); }
function nextQuizQuestion(){ state.quizIndex++; renderStage(); }
function restartQuiz(){ state.quizIndex=0; state.quizAnswers={}; renderStage(); }
document.getElementById("backBtn").onclick=function(){ if(state.current>0){ state.current--; renderStage(); } };
document.getElementById("nextBtn").onclick=function(){ if(state.current<CELLS.length-1){ state.current++; renderStage(); } else { state={current:0,practiceIndex:0,practiceAnswers:{},diffIndex:0,diffAnswers:{},quizIndex:0,quizAnswers:{}}; renderStage(); } };
renderStage();
</script>
</body>
</html>
