    return '<div class="icon-badge">📶</div><span class="step-label">Marco conceptual</span><h3>Señales paracrinas, no reemplazo</h3>' +
      '<p>En MSC, exosomas e implante placentario, el beneficio no viene de reemplazar físicamente el tejido — viene de señales que modifican el microambiente para que el propio tejido del paciente repare.</p>' +
      '<div class="card"><p style="margin:0;">Es útil pensarlo como la diferencia entre <strong style="color:#fff;">reconstruir una casa</strong> (reemplazo directo) y <strong style="color:#fff;">coordinar mejor a los trabajadores que ya están reparándola</strong> (efecto paracrino) — el segundo es, en la mayoría de estos biológicos, el mecanismo real.</p></div>';
  }},
  { label: "33 · Quién NO es candidato", render: function() {
    return '<div class="icon-badge">🚫</div><span class="step-label">Marco conceptual</span><h3>¿Quién NO es candidato?</h3>' +
      '<p style="margin:0;">Infección activa/sepsis, cáncer sin valoración oncológica, embarazo sin evidencia suficiente, <strong style="color:#fff;">expectativas irreales</strong>, y <strong style="color:#fff;">negativa al seguimiento clínico</strong>.</p>';
  }},
  { label: "34 · Seguimiento clínico", render: function() {
    return '<div class="icon-badge">📈</div><span class="step-label">Marco conceptual</span><h3>Seguimiento post-tratamiento</h3>' +
      '<p>Escala de dolor, escala funcional, fotografía clínica, laboratorios, eventos adversos, calidad de vida.</p>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Sin seguimiento, es una experiencia — no medicina.</strong></p></div>';
  }},
  { label: "35 · GENESIS™: MSC", render: function() {
    return '<div class="icon-badge">💉</div><span class="step-label">Aplicación práctica</span><h3>MSC — dosis y vías</h3>' +
      '<div class="protocard"><div class="pname">MSC placentarias</div><div class="pcomp">Sistémico: 1M/kg. Intralesional/intraarticular: 10-28M según severidad.</div></div>';
  }},
  { label: "36 · GENESIS™: artrosis vs fractura", render: function() {
    return '<div class="icon-badge">🦴</div><span class="step-label">Aplicación práctica</span><h3>Artrosis vs. fractura aguda</h3>' +
      '<div class="protocard"><div class="pmeta">Artrosis: 10M intraarticular c/4-6 meses</div><div class="pmeta">Fractura aguda: 28M intralesional + IV simultáneo</div><div class="pwarn">Única indicación con combinación de vías: fractura aguda</div></div>';
  }},
  { label: "37 · GENESIS™: MUSE", render: function() {
    return '<div class="icon-badge">🧬</div><span class="step-label">Aplicación práctica</span><h3>MUSE Cells</h3>' +
      '<div class="protocard"><div class="pname">MUSE Cells</div><div class="pcomp">Mismo criterio de dosis y vía que MSC placentarias — pero son pluripotentes resistentes al estrés, no multipotentes: un nivel de potencial mayor (ver Jerarquía de potencial celular).</div></div>' +
      '<div class="card"><p style="margin:0;"><strong style="color:var(--gold-light);">Nota:</strong> por su relevancia actual dentro de la red, MUSE Cells tendrá su propio módulo dedicado próximamente — aquí solo se cubre lo esencial para ubicarlas dentro del catálogo de GENESIS™.</p></div>';
  }},
  { label: "38 · GENESIS™: Placenta", render: function() {
    return '<div class="icon-badge">💉</div><span class="step-label">Aplicación práctica</span><h3>Implante placentario — dosis y vía</h3>' +
      '<div class="protocard"><div class="pname">Implante placentario</div><div class="pcomp">1g o 2g según severidad. Vía subcutánea con técnica específica.</div></div>';
  }},
  { label: "39 · GENESIS™: DM2", render: function() {
    return '<div class="icon-badge">📅</div><span class="step-label">Aplicación práctica</span><h3>DM2 controlada vs. descompensada</h3>' +
      '<div class="protocard"><div class="pmeta">DM2 controlada: cada 6 meses</div><div class="pmeta">DM2 descompensada: cada 2 meses</div><div class="pwarn">La frecuencia se acorta ante descompensación — no es un calendario fijo</div></div>';
  }},
  { label: "40 · GENESIS™: NK", render: function() {
    return '<div class="icon-badge">🎯</div><span class="step-label">Aplicación práctica</span><h3>Células NK — dosis y vía</h3>' +
      '<div class="protocard"><div class="pname">Células NK</div><div class="pcomp">Monodosis estándar. Vía IV.</div><div class="pmeta">Cada 2 meses · Exclusivo pacientes oncológicos</div></div>';
  }},
  { label: "41 · Exosomas y PDRN", render: function() {
    return '<div class="icon-badge">🔗</div><span class="step-label">Aplicación práctica</span><h3>Referencia cruzada</h3>' +
      '<div class="protocard"><div class="pname">Exosomas</div><div class="pcomp">Por viales según severidad, no por peso. Combinables con MSC/MUSE en osteoarticular. Ver Módulo de Exosomas.</div></div>' +
      '<div class="protocard"><div class="pname">PDRN</div><div class="pwarn">Protocolo exacto de CODE CELLS® pendiente de confirmar — no asumir esquema de otro biológico.</div></div>';
  }},
  { label: "42 · Ejemplo guiado", render: function() {
    return '<div class="icon-badge">🩺</div><h3>Ejemplo guiado</h3>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Caso:</strong> Paciente con fractura aguda, candidato a MSC placentarias.</p></div>' +
      '<p><strong style="color:#fff;">Paso 1.</strong> No se maneja con el esquema de un caso crónico (artrosis, 10M intraarticular).</p>' +
      '<p><strong style="color:#fff;">Paso 2.</strong> Se usan 28 millones de células por vía intralesional.</p>' +
      '<p style="margin:0;"><strong style="color:#fff;">Paso 3 — conclusión.</strong> Es la única indicación con vías combinadas (intralesional + IV simultáneo): no existe "la dosis de MSC", existen dosis según indicación.</p>';
  }},
  { label: "43 · Práctica", render: function(st) {
    var idx = st.practiceIndex || 0; var c = PRACTICE_CASES[idx]; var answered = st.practiceAnswers[idx];
    var html = '<div class="icon-badge">✏️</div><h3>Práctica clínica</h3><p class="subcounter">Caso ' + (idx+1) + ' de ' + PRACTICE_CASES.length + '</p><div class="card"><p style="margin:0;">' + c.caseText + '</p></div>';
    c.opts.forEach(function(o,i){ var cls="opt"; if(answered!==undefined){ if(i===c.correct) cls+=" correct"; else if(i===answered) cls+=" wrong"; } html += '<button class="'+cls+'" onclick="pickPractice('+i+')">'+o+'</button>'; });
    if(answered!==undefined){ var ok=answered===c.correct; html += '<p class="feedback '+(ok?"ok":"bad")+'">'+(ok?"Correcto.":"No es correcto.")+'</p><p class="rationale">'+c.rationale+'</p>';
      if(idx<PRACTICE_CASES.length-1) html += '<button class="retry" onclick="nextPracticeCase()">Siguiente caso →</button>';
      else html += '<p style="font-size:13px;color:var(--teal-light);margin-top:10px;">Terminaste los casos de práctica. Continúa al diagnóstico diferencial.</p>'; }
    return html;
  }},
  { label: "44 · Diagnóstico diferencial", render: function(st) {
    var idx = st.diffIndex || 0; var c = DIFFERENTIAL_CASES[idx]; var answered = st.diffAnswers[idx];
    var html = '<div class="icon-badge">🔍</div><h3>Cuando dos criterios compiten</h3><p class="subcounter">Caso ' + (idx+1) + ' de ' + DIFFERENTIAL_CASES.length + '</p><div class="card"><p style="margin:0;">' + c.caseText + '</p></div>';
    c.opts.forEach(function(o,i){ var cls="opt"; if(answered!==undefined){ if(i===c.correct) cls+=" correct"; else if(i===answered) cls+=" wrong"; } html += '<button class="'+cls+'" onclick="pickDiff('+i+')">'+o+'</button>'; });
    if(answered!==undefined){ var ok=answered===c.correct; html += '<p class="feedback '+(ok?"ok":"bad")+'">'+(ok?"Correcto.":"No es correcto.")+'</p><p class="rationale">'+c.rationale+'</p>';
      if(idx<DIFFERENTIAL_CASES.length-1) html += '<button class="retry" onclick="nextDiffCase()">Siguiente caso →</button>';
      else html += '<p style="font-size:13px;color:var(--teal-light);margin-top:10px;">Terminaste el diagnóstico diferencial.</p>'; }
    return html;
  }},
  { label: "45 · Evaluación", render: function(st) {
    var idx = st.quizIndex || 0;
    if (idx >= QUESTIONS.length) {
      var correct=0; QUESTIONS.forEach(function(qu,qi){ if(st.quizAnswers[qi]===qu.correct) correct++; });
      var pct = Math.round((correct/QUESTIONS.length)*100); var passed = pct>=80;
      return '<div class="icon-badge">✅</div><h3>Resultado de la evaluación</h3><div class="card"><p style="font-size:32px;font-weight:700;margin:0 0 6px;color:'+(passed?"var(--teal-light)":"var(--danger)")+';">'+pct+'%</p><p style="margin:0;">'+correct+' de '+QUESTIONS.length+' correctas — '+(passed?"Aprobado (mínimo 80%)":"No aprobado, se requiere 80% o más")+'</p></div>' + (passed?"":'<button class="retry" onclick="restartQuiz()">Reintentar evaluación completa</button>');
    }
    var qu = QUESTIONS[idx]; var answered = st.quizAnswers[idx];
    var html = '<div class="icon-badge">✅</div><h3>Evaluación</h3><p class="subcounter">Reactivo ' + (idx+1) + ' de ' + QUESTIONS.length + '</p><div class="card"><p style="margin:0;font-weight:600;color:#fff;">' + qu.q + '</p></div>';
    qu.opts.forEach(function(o,i){ var cls="opt"; if(answered!==undefined){ if(i===qu.correct) cls+=" correct"; else if(i===answered) cls+=" wrong"; } html += '<button class="'+cls+'" onclick="pickQuiz('+i+')">'+o+'</button>'; });
    if(answered!==undefined){ var ok=answered===qu.correct; html += '<p class="feedback '+(ok?"ok":"bad")+'">'+(ok?"Correcto.":"Incorrecto — la respuesta correcta está marcada.")+'</p><button class="retry" onclick="nextQuizQuestion()">'+(idx===QUESTIONS.length-1?"Ver resultado":"Siguiente reactivo →")+'</button>'; }
    return html;
  }},
  { label: "46 · Resumen", render: function(st) {
    var correct=0; QUESTIONS.forEach(function(qu,qi){ if(st.quizAnswers[qi]===qu.correct) correct++; });
    var pct = Math.round((correct/QUESTIONS.length)*100) || 0; var passed = pct>=80;
    return '<div class="icon-badge">🏁</div><h3>Resumen y siguiente paso</h3>' +
      '<ul style="padding-left:18px;font-size:13.5px;color:var(--text-secondary);line-height:1.8;margin-bottom:1rem;">' +
      '<li>MSC: multipotentes, inmunomoduladoras — seguridad sólida, eficacia inconsistente entre ensayos.</li>' +
      '<li>Implante placentario: biomaterial acelular (no tejido vivo), scaffold de reparación lenta.</li>' +
      '<li>NK: inmunidad innata, exclusivas de oncología, menor riesgo de injerto contra huésped que linfocitos T.</li>' +
      '<li>MSC y MUSE se dosifican por peso o severidad — la fractura aguda es la única indicación con vías combinadas.</li>' +
      '<li>La frecuencia nunca es un calendario fijo: depende de la actividad de enfermedad o estado de control, reevaluado en cada visita.</li>' +
      '</ul>' +
      '<div class="card"><p style="font-weight:600;margin:0 0 4px;color:'+(passed?"var(--teal-light)":"var(--danger)")+';">Tu resultado: '+pct+'% — '+(passed?"módulo aprobado":"no aprobado, regresa a la celda 45 para reintentar")+'</p>' +
      '<p style="margin:8px 0 0;">Siguiente módulo sugerido: Farmacia e inyectables.</p></div>';
  }}
];

var state = { current: 0, practiceIndex: 0, practiceAnswers: {}, diffIndex: 0, diffAnswers: {}, quizIndex: 0, quizAnswers: {} };
var yaAvisoCompletado = false;
function renderDots(){ var dots=document.getElementById("dots"); dots.innerHTML=""; CELLS.forEach(function(c,i){ var d=document.createElement("div"); d.className="dot"+(i===state.current?" active":""); dots.appendChild(d); }); }
function renderStage(){
  var stage=document.getElementById("stage");
  stage.innerHTML='<div class="cell active">'+CELLS[state.current].render(state)+'</div>';
  document.getElementById("cellLabel").textContent=CELLS[state.current].label;
  document.getElementById("backBtn").disabled=state.current===0;
  var nextBtn=document.getElementById("nextBtn"); var blocked=false;
  if(state.current===42) blocked=!(state.practiceIndex===PRACTICE_CASES.length-1 && state.practiceAnswers[PRACTICE_CASES.length-1]!==undefined);
  else if(state.current===43) blocked=!(state.diffIndex===DIFFERENTIAL_CASES.length-1 && state.diffAnswers[DIFFERENTIAL_CASES.length-1]!==undefined);
  else if(state.current===44) blocked=state.quizIndex<QUESTIONS.length;
  nextBtn.disabled=blocked;
  nextBtn.textContent = state.current===CELLS.length-1 ? "Reiniciar módulo" : (blocked?"Completa los casos para continuar":"Siguiente →");
  renderDots();

  // Avisar al hub SOLO al llegar a la última pantalla (Resumen) Y solo si
  // se aprobó — nunca por abrir el módulo o navegar libremente.
  if (state.current === CELLS.length - 1 && !yaAvisoCompletado) {
    var _correct = 0; QUESTIONS.forEach(function(_qu,_qi){ if(state.quizAnswers[_qi]===_qu.correct) _correct++; });
    var _pct = QUESTIONS.length ? Math.round((_correct/QUESTIONS.length)*100) : 0;
    if (_pct >= 80) {
      yaAvisoCompletado = true;
      try { window.parent.postMessage({ tipo: 'code_cells_modulo_completado', moduloId: MODULO_ID }, '*'); } catch (e) {}
    }
  }
}
function pickPractice(i){ var idx=state.practiceIndex; if(state.practiceAnswers[idx]!==undefined) return; state.practiceAnswers[idx]=i; renderStage(); }
function nextPracticeCase(){ state.practiceIndex++; renderStage(); }
function pickDiff(i){ var idx=state.diffIndex; if(state.diffAnswers[idx]!==undefined) return; state.diffAnswers[idx]=i; renderStage(); }
function nextDiffCase(){ state.diffIndex++; renderStage(); }
function pickQuiz(i){ var idx=state.quizIndex; if(state.quizAnswers[idx]!==undefined) return; state.quizAnswers[idx]=i; renderStage(); }
function nextQuizQuestion(){ state.quizIndex++; renderStage(); }
function restartQuiz(){ state.quizIndex=0; state.quizAnswers={}; renderStage(); }
document.getElementById("backBtn").onclick=function(){ if(state.current>0){ state.current--; renderStage(); } };
document.getElementById("nextBtn").onclick=function(){ if(state.current<CELLS.length-1){ state.current++; renderStage(); } else { state={current:0,practiceIndex:0,practiceAnswers:{},diffIndex:0,diffAnswers:{},quizIndex:0,quizAnswers:{}}; renderStage(); } };
renderStage();
</script>
</body>
</html>
