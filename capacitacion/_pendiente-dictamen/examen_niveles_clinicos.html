<!DOCTYPE html>

<title>Casos Clínicos Integradores</title>
<style>
  :root {
    --navy: #081327; --navy-800: #0f2444; --surface: #14294c;
    --teal: #12968a; --teal-light: #4fd1c0; --danger: #e0665f;
    --gold: #c8a050; --gold-light: #e0c185; --purple: #b79ae0;
    --text: #eef2f6; --text-secondary: #a7b4c9; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--navy); color:var(--text); display:flex; justify-content:center; padding:32px 16px; }
  .wrap { width:100%; max-width:660px; }
  .dots { display:flex; gap:3px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--surface); transition:background .3s; }
  .dot.active { background:var(--teal-light); }
  .stage { position:relative; min-height:440px; max-height:660px; overflow-y:auto; background:var(--navy-800); border-radius:20px; padding:30px 28px; }
  .cell { opacity:0; transform:translateX(20px); transition:opacity .35s ease, transform .35s ease; }
  .cell.active { opacity:1; transform:translateX(0); }
  .icon-badge { width:52px; height:52px; border-radius:50%; background:rgba(79,209,192,0.12); display:flex; align-items:center; justify-content:center; margin-bottom:16px; font-size:24px; }
  h3 { margin:0 0 12px; font-size:19px; font-weight:600; color:#fff; }
  h4 { margin:16px 0 6px; font-size:12.5px; font-weight:700; color:var(--gold-light); letter-spacing:0.03em; text-transform:uppercase; }
  p { font-size:14.5px; line-height:1.65; color:var(--text-secondary); margin:0 0 10px; }
  .card { background:var(--surface); border-radius:var(--radius); padding:14px 16px; margin-bottom:10px; }
  .card p { margin:0; }
  .step-label { display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:var(--teal-light); background:rgba(79,209,192,0.1); border-radius:20px; padding:4px 10px; margin-bottom:10px; }
  .chip-row { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
  .chip { background:var(--surface); border-radius:20px; padding:7px 12px; font-size:12px; font-weight:600; color:var(--text); }
  .protocard { background:var(--surface); border-left:3px solid var(--teal-light); border-radius:8px; padding:10px 14px; margin-bottom:8px; }
  .protocard .pname { font-weight:700; color:#fff; font-size:13.5px; margin-bottom:4px; }
  .protocard .pcomp { font-size:12.5px; color:var(--text-secondary); margin-bottom:4px; }
  .opt { display:block; width:100%; text-align:left; background:var(--surface); color:var(--text); border:1.5px solid transparent; border-radius:10px; padding:11px 14px; font-size:13.5px; margin-bottom:8px; cursor:pointer; }
  .opt:hover { border-color:var(--teal); }
  .opt.correct { border-color:var(--teal-light); color:var(--teal-light); }
  .opt.wrong { border-color:var(--danger); color:var(--danger); }
  .feedback { font-size:13px; margin:8px 0 0; }
  .feedback.ok { color:var(--teal-light); }
  .feedback.bad { color:var(--danger); }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
  button.navbtn { background:var(--teal); color:#04211d; border:none; border-radius:10px; padding:10px 18px; font-size:13.5px; font-weight:600; cursor:pointer; }
  button.navbtn.secondary { background:transparent; color:var(--text-secondary); border:1px solid var(--surface); }
  button.navbtn:disabled { opacity:0.3; cursor:default; }
  .label { font-size:10.5px; color:var(--text-secondary); letter-spacing:0.04em; text-transform:uppercase; }
  button.retry { background:transparent; border:1px solid var(--teal); color:var(--teal-light); border-radius:8px; padding:7px 14px; font-size:12.5px; margin-top:8px; cursor:pointer; }
  .rationale { border-left:2px solid var(--teal); padding-left:12px; margin-top:10px; }
  .nova-btn {
    position: fixed; bottom: 22px; right: 22px; z-index: 999;
    display: flex; align-items: center; gap: 8px;
    background: var(--teal); color: #04211d; text-decoration: none;
    font-family: 'Segoe UI', system-ui, sans-serif; font-weight: 700; font-size: 13px;
    padding: 12px 18px; border-radius: 30px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.45);
    transition: transform .15s ease;
  }
  .nova-btn:hover { transform: translateY(-2px); }
  @media (max-width: 480px) {
    .nova-btn { bottom: 14px; right: 14px; padding: 10px 14px; font-size: 12px; }
  }
</style>

      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Exploración:</strong> ' + c.exploracion + '</p></div>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Labs:</strong> ' + c.labs + '</p></div>' +
      '<div class="card" style="border-left:3px solid var(--gold-light);"><p style="margin:0;"><strong style="color:#fff;">Diagnóstico funcional:</strong> ' + c.diagnostico + '</p></div>';
  }},
  { label: "Caso 3 · Razonamiento", render: function(st) {
    return renderPregunta(2, st);
  }},
  { label: "Caso 3 · Enfoque integrador", render: function() {
    return renderEnfoque(2);
  }},
  { label: "Caso 4 · Presentación", render: function() {
    var c = CASOS[3];
    return '<div class="icon-badge">📋</div><span class="step-label">Caso 4 de 4</span><h3>' + c.nombre + '</h3>' +
      '<p style="margin:0 0 8px;color:var(--teal-light);font-weight:600;">' + c.resumen + '</p>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Ficha:</strong> ' + c.ficha + '</p></div>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Motivo de consulta:</strong> ' + c.motivo + '</p></div>';
  }},
  { label: "Caso 4 · Antecedentes", render: function() {
    var c = CASOS[3];
    return '<div class="icon-badge">📖</div><span class="step-label">Caso 4 de 4</span><h3>Antecedentes y padecimiento actual</h3>' +
      '<div class="card"><p style="margin:0;">' + c.antecedentes + '</p></div>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Padecimiento actual:</strong> ' + c.padecimiento + '</p></div>';
  }},
  { label: "Caso 4 · Exploración y labs", render: function() {
    var c = CASOS[3];
    return '<div class="icon-badge">🔬</div><span class="step-label">Caso 4 de 4</span><h3>Exploración y laboratorios</h3>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Exploración:</strong> ' + c.exploracion + '</p></div>' +
      '<div class="card"><p style="margin:0;"><strong style="color:#fff;">Labs:</strong> ' + c.labs + '</p></div>' +
      '<div class="card" style="border-left:3px solid var(--gold-light);"><p style="margin:0;"><strong style="color:#fff;">Diagnóstico funcional:</strong> ' + c.diagnostico + '</p></div>';
  }},
  { label: "Caso 4 · Razonamiento", render: function(st) {
    return renderPregunta(3, st);
  }},
  { label: "Caso 4 · Enfoque integrador", render: function() {
    return renderEnfoque(3);
  }},
  { label: "Resumen", render: function() {
    return '<div class="icon-badge">🏁</div><h3>Resumen y cierre</h3>' +
      '<ul style="padding-left:18px;font-size:13.5px;color:var(--text-secondary);line-height:1.8;margin-bottom:1rem;">' +
      '<li>Un paciente real casi nunca encaja en un solo sistema — el diagnóstico funcional casi siempre pide combinar Optimización Biológica Intravenosa, homotoxicología, péptidos y/o biológicos.</li>' +
      '<li>Tratar síntoma por síntoma, sin ver el estado biológico integrado, es el mismo error que ya vimos en Homotoxicología — aquí se practicó con casos reales.</li>' +
      '<li>Reconocer los límites del catálogo (lo que SÍ es CODE CELLS® vs. lo que requiere valoración médica específica) es tan importante como saber combinar bien lo que sí aplica.</li>' +
      '<li>La honestidad sobre el nivel de evidencia disponible — incluso cuando el paciente pide más — es parte del manejo clínico correcto, no un obstáculo para vender un protocolo.</li>' +
      '</ul>' +
      '<div class="card"><p style="margin:0;">Este repaso se completó automáticamente al llegar aquí — no se califica, y puedes volver a repasar cualquier caso cuando quieras.</p></div>';
  }}
];

function renderPregunta(idx, st) {
  var c = CASOS[idx];
  var key = 'preg' + idx;
  var answered = st.respuestas[key];
  var html = '<div class="icon-badge">🤔</div><span class="step-label">Caso ' + (idx+1) + ' de 4</span><h3>' + c.pregunta + '</h3>';
  c.opciones.forEach(function(o, i) {
    var cls = "opt";
    if (answered !== undefined) { if (i === c.correcta) cls += " correct"; else if (i === answered) cls += " wrong"; }
    html += '<button class="' + cls + '" onclick="responder(\'' + key + '\',' + i + ')">' + o + '</button>';
  });
  if (answered !== undefined) {
    var ok = answered === c.correcta;
    html += '<p class="feedback ' + (ok ? "ok" : "bad") + '">' + (ok ? "Correcto." : "La opción correcta está marcada.") + '</p>' +
      '<p class="rationale">' + c.justificacionPregunta + '</p>';
  }
  return html;
}

function renderEnfoque(idx) {
  var c = CASOS[idx];
  var html = '<div class="icon-badge">🧭</div><span class="step-label">Caso ' + (idx+1) + ' de 4</span><h3>Enfoque integrador sugerido</h3>';
  c.enfoque.forEach(function(e) {
    html += '<div class="protocard"><div class="pname">' + e.sistema + '</div><div class="pcomp">' + e.detalle + '</div></div>';
  });
  html += '<div class="card" style="border-left:3px solid var(--danger);"><p style="margin:0;"><strong style="color:var(--danger);">Límite a respetar:</strong> ' + c.notaLimite + '</p></div>';
  return html;
}

var state = { current: 0, respuestas: {} };
var yaAvisoCompletado = false;
function renderDots(){ var dots=document.getElementById("dots"); dots.innerHTML=""; CELLS.forEach(function(c,i){ var d=document.createElement("div"); d.className="dot"+(i===state.current?" active":""); dots.appendChild(d); }); }
function renderStage(){
  var stage=document.getElementById("stage");
  stage.innerHTML='<div class="cell active">'+CELLS[state.current].render(state)+'</div>';
  document.getElementById("cellLabel").textContent = (state.current+1) + " · " + CELLS[state.current].label;
  document.getElementById("backBtn").disabled=state.current===0;
  var nextBtn=document.getElementById("nextBtn");
  var label = CELLS[state.current].label;
  var blocked = false;
  if (label.indexOf("Razonamiento") !== -1) {
    var idx = parseInt(label.charAt(5)) - 1; // "Caso N · Razonamiento"
    blocked = state.respuestas['preg' + idx] === undefined;
  }
  nextBtn.disabled = blocked;
  nextBtn.textContent = state.current===CELLS.length-1 ? "Reiniciar repaso" : (blocked ? "Responde para continuar" : "Siguiente →");
  renderDots();
  stage.scrollTop = 0;

  if (label === "Resumen" && !yaAvisoCompletado) {
    yaAvisoCompletado = true;
    try { window.parent.postMessage({ tipo: 'code_cells_modulo_completado', moduloId: MODULO_ID }, '*'); } catch (e) {}
  }
}
function responder(key, i) {
  if (state.respuestas[key] !== undefined) return;
  state.respuestas[key] = i;
  renderStage();
}
document.getElementById("backBtn").onclick=function(){ if(state.current>0){ state.current--; renderStage(); } };
document.getElementById("nextBtn").onclick=function(){ if(state.current<CELLS.length-1){ state.current++; renderStage(); } else { state={current:0,respuestas:{}}; yaAvisoCompletado=false; renderStage(); } };
renderStage();
</script>
</body>
</html>
