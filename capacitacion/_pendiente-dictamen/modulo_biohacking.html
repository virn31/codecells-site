<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biohacking y Optimización Biológica | CODE CELLS™</title>
    <style>
        :root {
            --navy: #081327;
            --navy-800: #0f2444;
            --surface: #14294c;
            --teal: #12968a;
            --teal-light: #4fd1c0;
            --danger: #e0665f;
            --gold: #c8a050;
            --gold-light: #e0c185;
            --purple: #b79ae0;
            --text: #eef2f6;
            --text-secondary: #a7b4c9;
            --radius: 14px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--navy);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 32px 16px;
        }

        .wrap {
            width: 100%;
            max-width: 660px;
        }

        .dots {
            display: flex;
            gap: 4px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--surface);
            transition: background 0.3s;
            cursor: pointer;
        }

        .dot.active {
            background: var(--teal-light);
        }

        .stage {
            position: relative;
            min-height: 420px;
            max-height: 640px;
            overflow-y: auto;
            background: var(--navy-800);
            border-radius: 20px;
            padding: 30px 28px;
        }

        .cell {
            opacity: 0;
            transform: translateX(20px);
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .cell.active {
            opacity: 1;
            transform: translateX(0);
        }

        .icon-badge {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(79, 209, 192, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            font-size: 24px;
        }

        h3 {
            margin: 0 0 12px;
            font-size: 19px;
            font-weight: 600;
            color: #fff;
        }

        h4 {
            margin: 16px 0 6px;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        p {
            font-size: 14.5px;
            line-height: 1.65;
            color: var(--text-secondary);
            margin: 0 0 10px;
        }

        .card {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 14px 16px;
            margin-bottom: 10px;
        }

        .card p {
            margin: 0 0 8px;
        }

        .card p:last-child {
            margin: 0;
        }

        .step-label {
            display: inline-block;
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--teal-light);
            background: rgba(79, 209, 192, 0.1);
            border-radius: 20px;
            padding: 4px 10px;
            margin-bottom: 10px;
        }

        .step-label.p2 {
            color: var(--gold-light);
            background: rgba(200, 160, 80, 0.1);
        }

        .step-label.p3 {
            color: var(--purple);
            background: rgba(183, 154, 224, 0.1);
        }

        .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 10px;
        }

        .chip {
            background: var(--surface);
            border-radius: 20px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
        }

        .opt {
            display: block;
            width: 100%;
            text-align: left;
            background: var(--surface);
            color: var(--text);
            border: 1.5px solid transparent;
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 13.5px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .opt:hover {
            border-color: var(--teal);
        }

        .opt.correct {
            border-color: var(--teal-light);
            color: var(--teal-light);
        }

        .opt.wrong {
            border-color: var(--danger);
            color: var(--danger);
        }

        .opt:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .feedback {
            font-size: 13px;
            margin: 8px 0 0;
        }

        .feedback.ok {
            color: var(--teal-light);
        }

        .feedback.bad {
            color: var(--danger);
        }

        .rationale {
            border-left: 2px solid var(--teal);
            padding-left: 12px;
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        button.navbtn {
            background: var(--teal);
            color: #04211d;
            border: none;
            border-radius: 10px;
            padding: 10px 18px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button.navbtn:hover:not(:disabled) {
            background: var(--teal-light);
        }

        button.navbtn.secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--surface);
        }

        button.navbtn.secondary:hover:not(:disabled) {
            border-color: var(--teal);
            color: var(--teal-light);
        }

        button.navbtn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .label {
            font-size: 10.5px;
            color: var(--text-secondary);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        button.retry {
            background: transparent;
            border: 1px solid var(--teal);
            color: var(--teal-light);
            border-radius: 8px;
            padding: 7px 14px;
            font-size: 12.5px;
            margin-top: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button.retry:hover {
            background: rgba(79, 209, 192, 0.1);
        }

        .subcounter {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .mini-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
            font-size: 11.5px;
        }

        .mini-table th,
        .mini-table td {
            text-align: left;
            padding: 7px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .mini-table th {
            color: var(--gold-light);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .protocard {
            background: var(--surface);
            border-left: 3px solid var(--teal-light);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 8px;
        }

        .protocard .pname {
            font-weight: 700;
            color: #fff;
            font-size: 13.5px;
            margin-bottom: 4px;
        }

        .protocard .pcomp {
            font-size: 12.5px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .protocard .pmeta {
            font-size: 11px;
            color: var(--teal-light);
            font-family: monospace;
            margin-bottom: 4px;
        }

        .pillar-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .pillar-item {
            background: var(--surface);
            border-left: 2px solid var(--teal-light);
            border-radius: 8px;
            padding: 10px 12px;
        }

        .pillar-item h4 {
            margin: 0 0 4px;
            font-size: 11.5px;
        }

        .pillar-item p {
            font-size: 11.5px;
            margin: 0;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .success-message {
            background: rgba(79, 209, 192, 0.12);
            border-left: 3px solid var(--teal-light);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        .success-message .icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .success-message h3 {
            color: var(--teal-light);
            margin: 0 0 8px;
        }

        .success-message p {
            margin: 0;
            font-size: 13px;
        }

        .exam-section {
            margin-bottom: 16px;
        }

        .exam-question {
            background: var(--surface);
            border-left: 2px solid var(--purple);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 12px;
        }

        .exam-question .question-number {
            font-size: 10px;
            color: var(--purple);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .exam-question .question-text {
            font-size: 13.5px;
            color: #fff;
            font-weight: 500;
            margin-bottom: 8px;
        }

        @media (max-width: 480px) {
            .pillar-grid {
                grid-template-columns: 1fr;
            }

            .stage {
                padding: 20px 16px;
            }

            .nav {
                flex-direction: column;
                gap: 12px;
            }

            button.navbtn {
                width: 100%;
            }
        }

        .hidden {
            display: none !important;
        }

        ul {
            padding-left: 18px;
            font-size: 13.5px;
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 1rem;
        }

        li {
            margin-bottom: 6px;
        }

        strong {
            color: var(--gold-light);
        }
    </style>
  <script src="/lib/i18n.js"></script>
</head>
<body>
    <div class="wrap">
        <div class="dots" id="dots"></div>
        <div class="stage" id="stage"></div>
        <div class="nav">
            <button class="navbtn secondary" id="backBtn">← Anterior</button>
            <span class="label" id="cellLabel"></span>
            <button class="navbtn" id="nextBtn">Siguiente →</button>
        </div>
    </div>

    <script>
        // CONTENIDO DEL MÓDULO - 8 BLOQUES
        const CELLS = [
            {
                label: "Bienvenida",
                render: function(st) {
                    return '<div class="icon-badge">🎯</div><span class="step-label">Objetivo</span><h3>Biohacking y Optimización Biológica</h3>' +
                        '<div class="card"><p><strong>Al completar este módulo, comprenderás por qué la optimización biológica es fundamental para la medicina moderna y cómo redefine el papel del médico en la preservación de la función humana.</strong></p></div>' +
                        '<h4>¿Por qué existe este curso?</h4>' +
                        '<p>La medicina tradicional responde: <strong>¿Qué enfermedad tiene este paciente?</strong></p>' +
                        '<p>Es una pregunta valiosa, pero incompleta.</p>' +
                        '<p>La optimización biológica agrega otra pregunta igualmente poderosa: <strong>¿Qué sistemas fisiológicos están limitando la capacidad funcional de este paciente?</strong></p>' +
                        '<div class="card"><p style="color:var(--teal-light);"><strong>No es un reemplazo.</strong> Es un complemento. Ambas preguntas deben coexistir en la mente del médico moderno.</p></div>' +
                        '<h4>Una breve historia de por qué ahora</h4>' +
                        '<p>Durante décadas, la medicina se concentró en enfermedad y muerte. Vivimos más años. Muchísimos más años. Y la pregunta que antes era marginal ahora es urgente: <strong>¿Cómo vivimos esos años?</strong></p>' +
                        '<p style="margin:0;"><strong>No es suficiente agregar años a la vida. El objetivo moderno es agregar vida a los años.</strong></p>';
                }
            },
            {
                label: "Biohacking: perspectiva médica",
                render: function(st) {
                    return '<div class="icon-badge">🧬</div><span class="step-label p2">Contexto</span><h3>¿Qué es realmente el biohacking?</h3>' +
                        '<p style="margin-bottom:12px;">(No la definición de Wikipedia.)</p>' +
                        '<p>El biohacking no es una especialidad médica formal. No tiene un cuerpo único de conocimiento.</p>' +
                        '<p><strong>Es un movimiento heterogéneo que combina:</strong></p>' +
                        '<ul><li>Prácticas con altísimos niveles de evidencia (ejercicio, sueño)</li>' +
                        '<li>Intervenciones con evidencia sólida (suplementación específica)</li>' +
                        '<li>Estrategias prometedoras pero en investigación (péptidos, biológicos)</li>' +
                        '<li>Pseudo-ciencia, moda viral e incentivos comerciales</li></ul>' +
                        '<div class="card"><p><strong style="color:var(--teal-light);">Como médico:</strong> tu rol es separar señal de ruido, evidencia de marketing. Eso requiere entender el origen del movimiento.</p></div>' +
                        '<h4>¿Por qué apareció?</h4>' +
                        '<p>A principios de los 2000, Dave Asprey popularizó que los humanos podían "hackear" su biología. Quantified Self surgió en Silicon Valley. Las condiciones eran perfectas: wearables baratos, secuenciación genética accesible, descontento con medicina preventiva pobre.</p>' +
                        '<h4>¿Por qué existe tanta desinformación?</h4>' +
                        '<p><strong>1. Incentivos comerciales desalineados:</strong> Vender suplementos es rentable. La ciencia rigorosa no lo es tanto.</p>' +
                        '<p><strong>2. La complejidad se oculta:</strong> "El sueño regenera tus células" es viral. Explicar fases NREM, onda lenta, hormona del crecimiento y sistema glinfático… no lo es.</p>' +
                        '<p style="margin:0;"><strong>3. Datos anecdóticos vs. sistemáticos:</strong> Un influencer dice que tomó este péptido y durmió mejor. Suena creíble. Pero no es evidencia.</p>';
                }
            },
            {
                label: "Conceptos principales",
                render: function(st) {
                    return '<div class="icon-badge">🔬</div><span class="step-label p3">Fundamentos</span><h3>Del envejecimiento a la optimización</h3>' +
                        '<h4>¿Por qué envejecemos?</h4>' +
                        '<p>El envejecimiento es acumulación de daño molecular:</p>' +
                        '<ul><li>Estrés oxidativo (radicales libres)</li>' +
                        '<li>Inflamación crónica de bajo grado</li>' +
                        '<li>Disfunción mitocondrial</li>' +
                        '<li>Acortamiento telomérico</li>' +
                        '<li>Acumulación de proteínas mal plegadas</li>' +
                        '<li>Pérdida de capacidad regenerativa</li></ul>' +
                        '<div class="card"><p style="color:var(--teal-light);"><strong>La buena noticia:</strong> casi todos estos procesos son modulables.</p></div>' +
                        '<h4>Edad cronológica vs. edad biológica</h4>' +
                        '<p>Tienes 45 años de calendario. ¿Pero cuántos años tiene tu cuerpo? Dos pacientes de 45 años pueden tener edades biológicas de 35 y 60 años. <strong>La diferencia: decisiones, no genes.</strong></p>' +
                        '<p><strong>La edad biológica es modificable.</strong> Más aún que la cronológica.</p>' +
                        '<h4>¿Qué significa optimizar un organismo?</h4>' +
                        '<div class="pillar-grid">' +
                        '<div class="pillar-item"><h4>Máxima función</h4><p>Operar al mejor de sus capacidades</p></div>' +
                        '<div class="pillar-item"><h4>Máxima resiliencia</h4><p>Manejar estrés sin colapsar</p></div>' +
                        '<div class="pillar-item"><h4>Máxima longevidad</h4><p>Vivir más conservando función</p></div>' +
                        '<div class="pillar-item"><h4>Máxima regeneración</h4><p>Reparar constantemente</p></div>' +
                        '</div>' +
                        '<h4>Los seis pilares de la optimización</h4>' +
                        '<p><strong>1️⃣ Nutrición:</strong> La célula necesita materia prima. Sin ella, no hay reparación.</p>' +
                        '<p><strong>2️⃣ Movimiento:</strong> El ejercicio es el medicamento más infravalorado. Genera miocinas y BDNF.</p>' +
                        '<p><strong>3️⃣ Sueño:</strong> Regenera. Libera hormona del crecimiento, activa sistema glinfático.</p>' +
                        '<p><strong>4️⃣ Estrés:</strong> La hormesis construye resiliencia. El distrés la destruye.</p>' +
                        '<p><strong>5️⃣ Inflamación:</strong> Es mecanismo de supervivencia. El problema es cuando pierde resolución.</p>' +
                        '<p style="margin:0;"><strong>6️⃣ Energía:</strong> Es resultado de los cinco anteriores funcionando bien.</p>';
                }
            },
            {
                label: "Ejemplo guiado",
                render: function(st) {
                    return '<div class="icon-badge">🩺</div><span class="step-label p2">Caso Real</span><h3>Gerardo: del síntoma al sistema</h3>' +
                        '<div class="card"><p><strong>Presentación:</strong> "Doctor, no tengo energía. Me cansa subir escaleras. Duermo mal."</p></div>' +
                        '<p><strong>¿Qué ve medicina tradicional?</strong> Fatiga. Ordena laboratorios.</p>' +
                        '<p><strong>¿Qué ve optimización biológica?</strong> "No tengo energía" es un síntoma resumen. Implica disfunción en múltiples sistemas.</p>' +
                        '<h4>Paso 1: Escuchar más allá</h4>' +
                        '<p>¿Cuándo empezó? Hace 2 años. ¿Qué pasó? Ascenso en el trabajo. Más estrés. Menos sueño. Más comidas rápidas. Menos ejercicio.</p>' +
                        '<p><strong>La historia ya nos dice: los seis pilares están dañados.</strong></p>' +
                        '<h4>Paso 2: Mapear sistemas disfuncionales</h4>' +
                        '<p><strong>Nutrición:</strong> Desayunos apurados. Almuerzos en restaurantes. Bajo en nutrientes densos.</p>' +
                        '<p><strong>Movimiento:</strong> Sedentarismo extremo. Cero ejercicio.</p>' +
                        '<p><strong>Sueño:</strong> 5-6 horas. Despierta 2-3 veces por noche.</p>' +
                        '<p><strong>Estrés:</strong> Trabajo demandante. Sin pausas. VFC comprometida.</p>' +
                        '<p><strong>Inflamación:</strong> PCR elevada, IL-6 elevada. Inflamación sistémica.</p>' +
                        '<p><strong>Energía:</strong> Mioquinas bajas, hormona del crecimiento baja, mitocondrias fatigadas.</p>' +
                        '<h4>Paso 3: Plan de intervención</h4>' +
                        '<p><strong>No es un "protocolo".</strong> Es estrategia personalizada. Nutrición: educación + batch cooking. Movimiento: 30min caminar rápido 5×/semana. Sueño: higiene no negociable. Estrés: pausas, respiración. Inflamación: será resultado de los anteriores.</p>' +
                        '<div class="card"><p style="color:var(--teal-light);"><strong>¿Qué pasó en el fondo?</strong> No fue una píldora mágica. Fue restauración de función a través de entendimiento fisiológico.</p></div>';
                }
            },
            {
                label: "Práctica: los pilares",
                render: function(st) {
                    var idx = st.practiceIndex || 0;
                    var c = PRACTICE_CASES[idx];
                    var answered = st.practiceAnswers[idx];
                    var html = '<div class="icon-badge">✏️</div><span class="step-label">Práctica</span><h3>Pilar ' + (idx + 1) + ' de 6</h3>' +
                        '<p class="subcounter">' + c.pillar + '</p>' +
                        '<div class="card"><p style="margin:0;">' + c.caseText + '</p></div>';
                    c.opts.forEach(function(o, i) {
                        var cls = "opt";
                        if (answered !== undefined) {
                            if (i === c.correct) cls += " correct";
                            else if (i === answered) cls += " wrong";
                        }
                        html += '<button class="' + cls + '" onclick="pickPractice(' + i + ')" ' + (answered !== undefined ? 'disabled' : '') + '>' + o + '</button>';
                    });
                    if (answered !== undefined) {
                        var ok = answered === c.correct;
                        html += '<p class="feedback ' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'Correcto.' : 'Incorrecto.') + '</p><p class="rationale">' + c.rationale + '</p>';
                        if (idx < PRACTICE_CASES.length - 1) html += '<button class="retry" onclick="nextPracticeCase()">Siguiente caso →</button>';
                        else html += '<p style="font-size:13px;color:var(--teal-light);margin-top:10px;">Completaste la práctica. Continúa al diagnóstico diferencial.</p>';
                    }
                    return html;
                }
            },
            {
                label: "Diagnóstico diferencial",
                render: function(st) {
                    var idx = st.diffIndex || 0;
                    var c = DIFFERENTIAL_CASES[idx];
                    var answered = st.diffAnswers[idx];
                    var html = '<div class="icon-badge">🔍</div><span class="step-label p3">Trampa ' + (idx + 1) + ' de 4</span><h3>Cuando dos criterios compiten</h3>' +
                        '<div class="card"><p style="margin:0;">' + c.caseText + '</p></div>';
                    c.opts.forEach(function(o, i) {
                        var cls = "opt";
                        if (answered !== undefined) {
                            if (i === c.correct) cls += " correct";
                            else if (i === answered) cls += " wrong";
                        }
                        html += '<button class="' + cls + '" onclick="pickDiff(' + i + ')" ' + (answered !== undefined ? 'disabled' : '') + '>' + o + '</button>';
                    });
                    if (answered !== undefined) {
                        var ok = answered === c.correct;
                        html += '<p class="feedback ' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'Correcto.' : 'No es correcto.') + '</p><p class="rationale">' + c.rationale + '</p>';
                        if (idx < DIFFERENTIAL_CASES.length - 1) html += '<button class="retry" onclick="nextDiffCase()">Siguiente trampa →</button>';
                        else html += '<p style="font-size:13px;color:var(--teal-light);margin-top:10px;">Completaste diagnóstico diferencial.</p>';
                    }
                    return html;
                }
            },
            {
                label: "Evaluación",
                render: function(st) {
                    var idx = st.quizIndex || 0;
                    if (idx >= QUESTIONS.length) {
                        var correct = 0;
                        QUESTIONS.forEach(function(qu, qi) {
                            if (st.quizAnswers[qi] === qu.correct) correct++;
                        });
                        var pct = Math.round((correct / QUESTIONS.length) * 100);
                        var passed = pct >= 80;
                        return '<div class="icon-badge">✅</div><span class="step-label p2">Resultado</span><h3>Evaluación completada</h3>' +
                            '<div class="success-message">' +
                            '<div class="icon" style="color:' + (passed ? 'var(--teal-light)' : 'var(--danger)') + ';">' + (passed ? '✓' : '✗') + '</div>' +
                            '<h3 style="margin:0 0 8px;">' + pct + '%</h3>' +
                            '<p style="margin:0;">' + correct + ' de ' + QUESTIONS.length + ' correctas — ' + (passed ? 'Aprobado (mínimo 80%)' : 'No aprobado, se requiere 80%') + '</p>' +
                            '</div>' + (passed ? '' : '<button class="retry" style="width:100%;margin-top:12px;" onclick="restartQuiz()">Reintentar evaluación</button>');
                    }
                    var qu = QUESTIONS[idx];
                    var answered = st.quizAnswers[idx];
                    var html = '<div class="icon-badge">✅</div><span class="step-label">Reactivo ' + (idx + 1) + ' de ' + QUESTIONS.length + '</span><h3>Evaluación</h3>' +
                        '<div class="exam-question"><div class="question-number">Pregunta ' + (idx + 1) + '</div><div class="question-text">' + qu.q + '</div>';
