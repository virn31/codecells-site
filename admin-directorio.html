<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Revisión del directorio — CODE CELLS™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Sans:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1410; --surface:#1A211B; --surface-2:#202820;
    --ink:#F2EFE6; --ink-muted:#A9B3A4; --ink-dim:#6E786C;
    --line:rgba(242,239,230,0.12); --line-strong:rgba(242,239,230,0.22);
    --gold:#E8A33D; --rojo:#D4654A; --verde:#5FAE6E;
    --display:"Fraunces",serif; --body:"IBM Plex Sans",sans-serif; --mono:"IBM Plex Mono",monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--body); font-weight:300; -webkit-font-smoothing:antialiased; }
  header{ display:flex; justify-content:space-between; align-items:center; padding:1.25rem clamp(1rem,4vw,3rem); border-bottom:1px solid var(--line); }
  header a{ color:var(--ink-muted); font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; text-decoration:none; }
  .marca{ font-family:var(--mono); font-size:.85rem; letter-spacing:.1em; }
  main{ max-width:1100px; margin:0 auto; padding:2rem clamp(1rem,4vw,3rem) 4rem; }
  h1{ font-family:var(--display); font-weight:400; font-size:clamp(1.8rem,4vw,2.6rem); margin:0 0 .4rem; }
  .lede{ color:var(--ink-muted); margin:0 0 2rem; line-height:1.6; }
  h2{ font-family:var(--mono); font-size:.75rem; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); margin:2.5rem 0 1rem; font-weight:500; }
  h2 .n{ color:var(--ink-dim); }
  .vacio{ color:var(--ink-dim); font-size:.9rem; }
  .tarjeta{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:1.25rem 1.4rem; margin-bottom:1rem; }
  .foto-perfil{ width:72px; height:72px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); display:block; }
  .fila{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:.5rem 1rem; align-items:baseline; }
  .nombre{ font-family:var(--display); font-size:1.25rem; }
  .chip{ font-family:var(--mono); font-size:.65rem; letter-spacing:.06em; text-transform:uppercase; padding:.3rem .6rem; border-radius:100px; border:1px solid var(--line-strong); color:var(--ink-muted); white-space:nowrap; }
  .chip.revision{ border-color:var(--gold); color:var(--gold); }
  .chip.publicado{ border-color:var(--verde); color:var(--verde); }
  .chip.alerta{ border-color:var(--rojo); color:var(--rojo); }
  dl{ display:grid; grid-template-columns:minmax(110px,160px) 1fr; gap:.35rem 1rem; margin:1rem 0 0; font-size:.9rem; }
  dt{ color:var(--ink-dim); }
  dd{ margin:0; overflow-wrap:anywhere; }
  .acciones{ display:flex; flex-wrap:wrap; gap:.6rem; margin-top:1.1rem; }
  button{ font:inherit; font-size:.85rem; border-radius:8px; padding:.6rem 1.1rem; cursor:pointer; border:1px solid var(--line-strong); background:transparent; color:var(--ink); }
  button.aprobar{ background:var(--gold); color:#14100A; border-color:var(--gold); font-weight:500; }
  button.peligro{ border-color:rgba(212,101,74,.6); color:var(--rojo); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  textarea{ width:100%; min-height:70px; margin-top:.8rem; background:var(--surface-2); color:var(--ink); border:1px solid var(--line-strong); border-radius:8px; padding:.6rem; font:inherit; font-size:.9rem; }
  .error{ color:var(--rojo); font-size:.85rem; margin-top:.6rem; }
  .ok{ color:var(--verde); font-size:.85rem; margin-top:.6rem; }
  details{ margin-top:.8rem; font-size:.8rem; color:var(--ink-muted); }
  details pre{ white-space:pre-wrap; font-family:var(--mono); font-size:.72rem; line-height:1.6; }
  .aviso{ border:1px solid var(--line-strong); border-radius:12px; padding:1rem 1.2rem; color:var(--ink-muted); line-height:1.6; }
  @media (max-width:560px){ dl{ grid-template-columns:1fr; } dt{ margin-top:.4rem; } }
</style>
</head>
<body>
<header>
  <span class="marca"><b>CODE CELLS™</b> · Directorio</span>
  <a href="/portal-medico.html">← Portal médico</a>
</header>
<main>
  <h1>Revisión del directorio</h1>
  <p class="lede">Aprueba un perfil solo si verificaste la cédula del médico y los datos son profesionales. Ningún perfil se publica sin consentimiento registrado. Cada acción queda en el historial del perfil.</p>
  <div id="contenido"><p class="vacio">Cargando perfiles…</p></div>
</main>
<script>
  const TOKEN = (() => { try { return sessionStorage.getItem('cc_medico_token'); } catch (e) { return null; } })();
  const contenido = document.getElementById('contenido');

  const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const fecha = iso => { try { return new Date(iso).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' }); } catch (e) { return iso; } };

  async function api(accion, metodo = 'GET', body) {
    const r = await fetch('/api/directorio?accion=' + accion, {
      method: metodo,
      headers: { Authorization: 'Bearer ' + TOKEN, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(d.error || ('Error ' + r.status)); e.status = r.status; throw e; }
    return d;
  }

  function grupo(p) {
    if (p.estado === 'En revisión') return 'revision';
    if (p.estado === 'Publicado' && !p.tieneConsentimiento) return 'sinConsentimiento';
    if (p.estado === 'Publicado' && p.cambiosSinRevisar) return 'cambios';
    if (p.estado === 'Publicado') return 'publicados';
    return 'otros';
  }
  const GRUPOS = [
    ['revision', 'Solicitudes por revisar'],
    ['cambios', 'Publicados con cambios sin revisar'],
    ['sinConsentimiento', 'Publicados SIN consentimiento registrado'],
    ['publicados', 'Publicados'],
    ['otros', 'Borradores, rechazados y despublicados'],
  ];

  function chip(p) {
    if (p.estado === 'En revisión') return '<span class="chip revision">En revisión</span>';
    if (p.estado === 'Publicado' && !p.tieneConsentimiento) return '<span class="chip alerta">Sin consentimiento</span>';
    if (p.estado === 'Publicado') return '<span class="chip publicado">Publicado</span>';
    return `<span class="chip">${esc(p.estado)}</span>`;
  }

  function tarjeta(p) {
    const m = p.medico || {};
    const puedeAprobar = p.tieneConsentimiento && !p.faltantes.length && (p.estado === 'En revisión' || (p.estado === 'Publicado' && p.cambiosSinRevisar));
    const textoAprobar = p.estado === 'Publicado' ? 'Marcar cambios como revisados' : 'Aprobar y publicar';
    return `
      <article class="tarjeta" data-id="${esc(p.id)}">
        <div class="fila"><span class="nombre">${esc(p.nombrePublico || '(sin nombre público)')}</span>${chip(p)}</div>
        <dl>
          <dt>Médico</dt><dd>${m.nombre ? esc(m.nombre) : '<span class="error">Sin médico ligado</span>'} ${m.codigo ? '· ' + esc(m.codigo) : ''}</dd>
          <dt>Cédula</dt><dd>${m.cedula ? esc(m.cedula) + ' · <a href="https://www.cedulaprofesional.sep.gob.mx/" target="_blank" rel="noopener" style="color:var(--gold)">verificar en la SEP</a>' : '<span class="error">No registrada en MÉDICOS</span>'}</dd>
          <dt>Foto</dt><dd>${p.foto ? `<a href="${esc(p.foto)}" target="_blank" rel="noopener"><img src="${esc(p.foto)}" alt="Foto del perfil" class="foto-perfil"></a>` : 'Sin foto (se muestran iniciales)'}</dd>
          <dt>Ciudad</dt><dd>${esc(p.ciudad) || '—'}</dd>
          <dt>Especialidades</dt><dd>${esc((p.especialidades || []).join(', ')) || '—'}</dd>
          <dt>Herramientas</dt><dd>${esc((p.tratamientos || []).join(', ')) || '—'}</dd>
          <dt>Presentación</dt><dd>${esc(p.bio) || '—'}</dd>
          <dt>Horarios</dt><dd>${esc(p.horarios) || '—'}</dd>
          <dt>Dirección</dt><dd style="white-space:pre-line">${esc(p.direccion) || '—'}</dd>
          <dt>Costo</dt><dd>${esc(p.costo) || 'No lo muestra'}</dd>
          <dt>Teléfono</dt><dd>${esc(p.telefono) || '—'}</dd>
          <dt>Liga</dt><dd>${p.liga ? `<a href="/directorio/${esc(p.liga)}" target="_blank" rel="noopener" style="color:var(--gold)">/directorio/${esc(p.liga)}</a>` : 'Se asigna al aprobar'}</dd>
          <dt>Redes</dt><dd>${Object.keys(p.redes || {}).length ? Object.entries(p.redes).map(([red, url]) => `${esc(red)}: <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:var(--gold)">${esc(url)}</a>`).join('<br>') : '—'}</dd>
          <dt>Consentimiento</dt><dd>${p.tieneConsentimiento ? esc(p.versionConsentimiento) + ' · ' + esc(fecha(p.fechaConsentimiento)) : '<span class="error">No registrado</span>'}</dd>
          ${p.faltantes.length ? `<dt>Falta</dt><dd class="error">${esc(p.faltantes.join(', '))}</dd>` : ''}
          ${p.motivoRechazo ? `<dt>Último rechazo</dt><dd>${esc(p.motivoRechazo)}</dd>` : ''}
          ${p.revisadoPor ? `<dt>Revisado</dt><dd>${esc(p.revisadoPor)} · ${esc(fecha(p.fechaRevision))}</dd>` : ''}
        </dl>
        ${p.historial ? `<details><summary>Historial</summary><pre>${esc(p.historial)}</pre></details>` : ''}
        <textarea placeholder="Motivo (obligatorio para rechazar; el médico lo verá)"></textarea>
        <div class="acciones">
          <button class="aprobar" data-accion="admin_aprobar" ${puedeAprobar ? '' : 'disabled'}>${textoAprobar}</button>
          ${p.estado === 'En revisión' ? '<button class="peligro" data-accion="admin_rechazar">Rechazar</button>' : ''}
          ${p.publicado ? '<button class="peligro" data-accion="admin_despublicar">Despublicar</button>' : ''}
        </div>
        <div class="msg"></div>
      </article>`;
  }

  function render(perfiles) {
    const porGrupo = {};
    perfiles.forEach(p => { (porGrupo[grupo(p)] = porGrupo[grupo(p)] || []).push(p); });
    contenido.innerHTML = GRUPOS.map(([k, titulo]) => {
      const lista = porGrupo[k] || [];
      if (!lista.length && (k === 'cambios' || k === 'sinConsentimiento')) return '';
      return `<h2>${titulo} <span class="n">· ${lista.length}</span></h2>` +
        (lista.length ? lista.map(tarjeta).join('') : '<p class="vacio">Nada por ahora.</p>');
    }).join('');
  }

  async function cargar() {
    if (!TOKEN) {
      contenido.innerHTML = '<div class="aviso">Entra primero al <a href="/portal-medico.html" style="color:var(--gold)">portal médico</a> y abre esta página desde "Mi directorio", en la misma pestaña.</div>';
      return;
    }
    try {
      const d = await api('admin_perfiles');
      render(d.perfiles || []);
    } catch (e) {
      contenido.innerHTML = `<div class="aviso">${e.status === 403 ? 'Tu cuenta no es administradora del directorio.' : e.status === 401 ? 'Tu sesión expiró. Vuelve a entrar al portal médico.' : 'No pudimos cargar los perfiles: ' + esc(e.message) + ' — esto es un error, no una lista vacía.'}</div>`;
    }
  }

  contenido.addEventListener('click', async ev => {
    const btn = ev.target.closest('button[data-accion]');
    if (!btn) return;
    const card = btn.closest('.tarjeta');
    const msg = card.querySelector('.msg');
    const motivo = card.querySelector('textarea').value.trim();
    const accion = btn.dataset.accion;
    if (accion === 'admin_rechazar' && !motivo) { msg.innerHTML = '<div class="error">Escribe el motivo del rechazo.</div>'; return; }
    card.querySelectorAll('button').forEach(b => b.disabled = true);
    msg.innerHTML = '';
    try {
      const d = await api(accion, 'POST', { recordId: card.dataset.id, motivo });
      const avisos = { enviado: 'Se avisó al médico por Telegram.', 'sin chat': 'El médico no tiene Telegram vinculado: avísale por otro medio.', 'falló': 'No se pudo avisar al médico por Telegram: avísale por otro medio.' };
      msg.innerHTML = `<div class="ok">Listo: ${esc(d.perfil.estado)}. ${esc(avisos[d.avisoMedico] || '')}</div>`;
      setTimeout(cargar, 1800);
    } catch (e) {
      msg.innerHTML = `<div class="error">${esc(e.message)}</div>`;
      card.querySelectorAll('button').forEach(b => b.disabled = false);
    }
  });

  cargar();
</script>
</body>
</html>
