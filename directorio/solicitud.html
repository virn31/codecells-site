<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Mi solicitud de cita — Red CODE CELLS™</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --surface: #1A211B;
      --bg-alt: #121810;
      --ink: #F2EFE6;
      --ink-muted: #A9B3A4;
      --line: rgba(242,239,230,0.12);
      --c-energy: #E8A33D;
      --c-balance: #4FA8A0;
      --c-regen: #5FAE6E;
      --font-display: "Fraunces", serif;
      --font-body: "IBM Plex Sans", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: #0E1410 url('/assets/nebula-nova.jpg') center/cover fixed no-repeat;
      color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
    }
    body::before { content: ''; position: fixed; inset: 0; background: rgba(14,20,16,0.92); z-index: -1; }
    header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header a { font-family: var(--font-display); font-size: 20px; color: var(--c-energy); text-decoration: none; }
    header .volver { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); }
    main { max-width: 620px; margin: 0 auto; padding: 40px 16px 80px; }
    .caja { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
    .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
    h1 { font-family: var(--font-display); font-style: italic; font-weight: 500; color: var(--c-energy); font-size: 1.8rem; margin: 6px 0 18px; overflow-wrap: anywhere; }
    .estado { display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 12px; background: rgba(242,239,230,0.04); border: 1px solid var(--line); }
    .punto { flex: 0 0 12px; height: 12px; border-radius: 50%; margin-top: 6px; background: var(--ink-muted); }
    .estado--ok .punto { background: var(--c-regen); }
    .estado--espera .punto { background: var(--c-energy); }
    .estado--accion { border-color: rgba(232,163,61,0.5); }
    .estado--accion .punto { background: var(--c-energy); }
    .estado--cerrada .punto { background: #8A8F86; }
    .estado strong { display: block; font-size: 16px; }
    .estado p { margin: 4px 0 0; color: var(--ink-muted); }
    .horario { font-family: var(--font-display); font-size: 1.3rem; color: var(--ink); margin-top: 6px; }
    .mensaje { margin-top: 16px; padding: 12px 14px; border-left: 3px solid var(--c-balance); background: rgba(79,168,160,0.08); border-radius: 0 8px 8px 0; white-space: pre-line; }
    .mensaje small { display: block; color: var(--ink-muted); margin-bottom: 4px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 20px 0 0; font-size: 14px; }
    dt { color: var(--ink-muted); }
    dd { margin: 0; }
    .botones { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
    .btn { padding: 11px 22px; border-radius: 999px; border: 0; cursor: pointer; background: var(--c-energy); color: #1A1406; font-family: var(--font-body); font-size: 15px; font-weight: 600; }
    .btn-sec { padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-family: var(--font-body); font-size: 14px; cursor: pointer; text-decoration: none; }
    .btn-peligro { border-color: rgba(240,138,115,0.5); color: #F08A73; }
    button:disabled { opacity: 0.6; cursor: wait; }
    .error { color: #F08A73; margin-top: 12px; min-height: 1em; font-size: 14px; }
    .confirmar-cancelar { margin-top: 14px; padding: 12px; border: 1px solid rgba(240,138,115,0.4); border-radius: 10px; display: none; }
    .confirmar-cancelar.visible { display: block; }
    .pie { margin-top: 18px; font-size: 12px; color: var(--ink-muted); }
  </style>
</head>
<body>
  <header>
    <a href="/">CODE CELLS™</a>
    <a class="volver" href="/directorio/">Directorio</a>
  </header>
  <main>
    <div class="caja" id="caja">Cargando tu solicitud…</div>
  </main>

  <script>
    // La clave viaja en el fragmento (#), que el navegador no manda al
    // servidor ni a otros sitios; se envía al API en el cuerpo de un POST.
    const params = new URLSearchParams(location.hash.slice(1));
    const ID = params.get('id') || '';
    const CLAVE = params.get('c') || '';

    const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    function fechaLarga(ymd) {
      if (!ymd) return '';
      try { return new Date(ymd + 'T12:00:00Z').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }); }
      catch (e) { return ymd; }
    }
    function horarioLargo(h) {
      const m = String(h || '').match(/^(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2})$/);
      return m ? `${fechaLarga(m[1])}, ${m[2]} h` : esc(h);
    }

    async function api(accion, extra) {
      const r = await fetch('/api/citas?accion=' + accion, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: ID, c: CLAVE, ...(extra || {}) }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'No pudimos completar la operación.');
      return d;
    }

    function textoEstado(s) {
      const quien = esc(s.medico || 'El médico');
      switch (s.estado) {
        case 'Pendiente':
          return { clase: 'estado--espera', titulo: 'Enviada, esperando respuesta', texto: `${quien} todavía no responde. <b>Esto aún no es una cita.</b> Vuelve a esta liga más tarde.` };
        case 'Aceptada':
          return { clase: 'estado--ok', titulo: 'Cita aceptada por el médico', texto: `${quien} te espera:`, horario: s.horario };
        case 'Otro horario propuesto':
          return { clase: 'estado--accion', titulo: 'Te proponen otro horario', texto: `${quien} no puede en la fecha que pediste y te propone:`, horario: s.horario, confirmar: true };
        case 'Confirmada por el paciente':
          return { clase: 'estado--ok', titulo: 'Cita acordada', texto: 'Confirmaste el horario que propuso el médico:', horario: s.horario };
        case 'Rechazada':
          return { clase: 'estado--cerrada', titulo: 'El médico no puede atenderte esta vez', texto: 'Puedes buscar otro médico en el directorio o intentar otra fecha.', cerrada: true };
        case 'Cancelada por el paciente':
          return { clase: 'estado--cerrada', titulo: 'Cancelaste esta solicitud', texto: 'El médico ya fue avisado.', cerrada: true };
        default:
          return { clase: '', titulo: esc(s.estado), texto: '' };
      }
    }

    function render(s, medicoId) {
      const t = textoEstado(s);
      document.getElementById('caja').innerHTML = `
        <div class="eyebrow">Solicitud de cita</div>
        <h1>${esc(s.medico || 'Médico de la Red')}</h1>
        <div class="estado ${t.clase}">
          <span class="punto" aria-hidden="true"></span>
          <div>
            <strong>${t.titulo}</strong>
            <p>${t.texto}</p>
            ${t.horario ? `<div class="horario">${horarioLargo(t.horario)}</div>` : ''}
          </div>
        </div>
        ${s.mensaje ? `<div class="mensaje"><small>Mensaje del médico</small>${esc(s.mensaje)}</div>` : ''}
        <dl>
          <dt>Pediste</dt><dd>${esc(fechaLarga(s.fechaPreferida))}${s.turno ? ' · ' + esc(s.turno.toLowerCase()) : ''}</dd>
        </dl>
        <div class="botones">
          ${t.confirmar ? '<button class="btn" id="b-confirmar">Confirmar este horario</button>' : ''}
          ${!t.cerrada ? `<button class="btn-sec btn-peligro" id="b-cancelar">${t.confirmar ? 'No me funciona, cancelar' : 'Cancelar solicitud'}</button>` : ''}
          ${t.cerrada ? '<a class="btn-sec" href="/directorio/">Buscar otro médico</a>' : ''}
          ${medicoId && !t.cerrada ? `<a class="btn-sec" href="/directorio/medico.html?id=${encodeURIComponent(medicoId)}">Ver perfil del médico</a>` : ''}
        </div>
        <div class="confirmar-cancelar" id="caja-cancelar">
          <p style="margin:0 0 10px">¿Seguro que quieres cancelar? El médico será avisado y no podrás reactivarla.</p>
          <button class="btn-sec btn-peligro" id="b-cancelar-si">Sí, cancelar</button>
          <button class="btn-sec" id="b-cancelar-no">No</button>
        </div>
        <div class="error" id="error" role="alert"></div>
        <p class="pie">Esta liga es personal: quien la tenga puede ver y cancelar tu solicitud. No muestra tu teléfono ni lo que escribiste.</p>`;
      const enlazar = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
      enlazar('b-confirmar', () => actuar('confirmar'));
      enlazar('b-cancelar', () => document.getElementById('caja-cancelar').classList.add('visible'));
      enlazar('b-cancelar-no', () => document.getElementById('caja-cancelar').classList.remove('visible'));
      enlazar('b-cancelar-si', () => actuar('cancelar'));
    }

    let MEDICO_ID = null;
    async function actuar(accion) {
      const err = document.getElementById('error');
      document.querySelectorAll('#caja button').forEach(b => { b.disabled = true; });
      err.textContent = '';
      try {
        await api('paciente', { accion });
        const actual = await api('estado');
        render(actual.solicitud, MEDICO_ID);
      } catch (e) {
        err.textContent = e.message;
        document.querySelectorAll('#caja button').forEach(b => { b.disabled = false; });
      }
    }

    (async () => {
      const caja = document.getElementById('caja');
      if (!/^rec[A-Za-z0-9]{14}$/.test(ID) || !CLAVE) {
        caja.innerHTML = '<h1>Liga incompleta</h1><p>Abre la liga completa que recibiste al enviar tu solicitud.</p>';
        return;
      }
      try {
        const d = await api('estado');
        MEDICO_ID = d.medicoId;
        render(d.solicitud, d.medicoId);
      } catch (e) {
        caja.innerHTML = `<h1>No pudimos mostrar tu solicitud</h1><p>${esc(e.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
