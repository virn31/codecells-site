<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Médico — Red CODE CELLS™</title>
  <meta name="description" content="Perfil del médico en el directorio de la Red CODE CELLS™ y solicitud de cita.">
  <link rel="icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,700;1,500&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Mismos tokens que /directorio/ */
    :root {
      --bg: #0E1410;
      --bg-alt: #121810;
      --surface: #1A211B;
      --surface-2: #202820;
      --ink: #F2EFE6;
      --ink-muted: #A9B3A4;
      --ink-dim: #6E786C;
      --line: rgba(242,239,230,0.12);
      --c-energy: #E8A33D;
      --c-repair: #D4654A;
      --c-balance: #4FA8A0;
      --c-regen: #5FAE6E;
      --cc-cream: #F4EFE3;
      --cc-ink: #1A1F1C;
      --font-display: "Fraunces", serif;
      --font-body: "IBM Plex Sans", sans-serif;
      --font-mono: "IBM Plex Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0E1410 url('/assets/nebula-nova.jpg') center/cover fixed no-repeat;
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, rgba(14,20,16,0.80) 0%, rgba(14,20,16,0.92) 55%, rgba(14,20,16,0.97) 100%);
      z-index: -1;
      pointer-events: none;
    }
    a { color: inherit; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 18px 40px; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 10;
      background: rgba(14,20,16,0.92); backdrop-filter: blur(12px);
    }
    header .logo { font-family: var(--font-display); font-size: 20px; color: var(--c-energy); text-decoration: none; }
    header .volver {
      font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-muted); text-decoration: none; padding: 8px 16px; border: 1px solid var(--line); border-radius: 999px;
    }
    header .volver:hover { color: var(--c-energy); border-color: rgba(232,163,61,0.4); }
    main { max-width: 820px; margin: 0 auto; padding: 40px 24px 80px; }

    .estado-pagina { text-align: center; padding: 60px 16px; color: var(--ink-muted); }
    .estado-pagina h1 { font-family: var(--font-display); color: var(--c-energy); font-weight: 500; }

    /* Ficha */
    .ficha {
      background: radial-gradient(circle at 100% 0%, rgba(79,168,160,0.10), transparent 55%), var(--surface);
      border: 1px solid var(--line); border-radius: 16px; padding: 32px;
    }
    .ficha__top { display: flex; gap: 28px; align-items: center; }
    .avatar {
      position: relative; flex: 0 0 132px; width: 132px; height: 132px; border-radius: 50%;
      border: 2px solid var(--c-energy); overflow: hidden; display: grid; place-items: center; background: var(--surface-2);
    }
    .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .avatar span { font-family: var(--font-display); font-style: italic; font-size: 2.6rem; color: var(--c-energy); }
    .ficha h1 {
      font-family: var(--font-display); font-style: italic; font-weight: 500;
      font-size: clamp(1.7rem, 4vw, 2.3rem); line-height: 1.15; color: var(--c-energy); margin: 0 0 6px; overflow-wrap: anywhere;
    }
    .ficha .ciudad { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-muted); }
    .filas { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 12px; }
    .fila { display: flex; align-items: center; gap: 12px; font-size: 15px; }
    .fila > span:last-child { overflow-wrap: anywhere; min-width: 0; }
    .fila--aviso { color: var(--ink-muted); font-style: italic; font-size: 14px; }
    .fila--tel { font-family: var(--font-mono); letter-spacing: 0.04em; }
    .icono {
      flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
      background: var(--c-balance); color: var(--cc-ink); display: grid; place-items: center;
    }
    .icono svg { width: 15px; height: 15px; }
    .seccion { margin-top: 28px; }
    .seccion h2 {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--c-energy); font-weight: 500; margin: 0 0 10px; padding-bottom: 8px; border-bottom: 1px solid rgba(232,163,61,0.15);
    }
    .bio { color: var(--ink-muted); line-height: 1.65; margin: 0; white-space: pre-line; }
    .chips { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 1px solid rgba(232,163,61,0.5); color: var(--c-energy); }
    .wa {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 18px; border-radius: 999px;
      background: var(--c-balance); color: var(--cc-ink); font-weight: 600; text-decoration: none;
    }
    /* Redes sociales: botones píldora con ícono; ligas ya validadas por el servidor. */
    .redes { list-style: none; padding: 0; margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .redes a {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-size: 14px;
      transition: border-color .15s, color .15s;
    }
    .redes a:hover, .redes a:focus-visible { border-color: rgba(232,163,61,0.6); color: var(--c-energy); }
    .redes svg { width: 18px; height: 18px; flex: 0 0 18px; }
    .legal { margin-top: 28px; font-size: 12px; color: var(--ink-dim); line-height: 1.6; }

    /* Formulario de solicitud */
    .solicitud {
      margin-top: 32px; background: var(--surface); border: 1px solid rgba(232,163,61,0.3); border-radius: 16px; padding: 32px;
    }
    .solicitud h2 { font-family: var(--font-display); font-weight: 500; font-size: 1.6rem; margin: 0 0 8px; color: var(--ink); }
    .nota {
      font-size: 14px; color: var(--ink-muted); background: rgba(79,168,160,0.08); border-left: 3px solid var(--c-balance);
      padding: 12px 14px; border-radius: 0 8px 8px 0; margin: 0 0 22px;
    }
    .rejilla { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .campo { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .campo--ancho { grid-column: 1 / -1; }
    .campo label, .campo legend { font-size: 13px; color: var(--ink-muted); padding: 0; }
    .campo input[type=text], .campo input[type=tel], .campo input[type=email], .campo input[type=date], .campo textarea {
      width: 100%; padding: 11px 12px; background: var(--bg-alt); color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; font-family: var(--font-body); font-size: 15px; color-scheme: dark;
    }
    .campo textarea { min-height: 90px; resize: vertical; }
    .campo input:focus, .campo textarea:focus { outline: none; border-color: rgba(232,163,61,0.6); }
    fieldset.campo { border: 0; margin: 0; padding: 0; }
    .turnos { display: flex; gap: 8px; flex-wrap: wrap; }
    .turnos label {
      display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px;
      cursor: pointer; color: var(--ink); font-size: 14px;
    }
    .turnos input { accent-color: var(--c-energy); }
    .turnos label:has(input:checked) { border-color: var(--c-energy); background: rgba(232,163,61,0.1); }
    .nota-chica { margin: 0 0 8px; color: var(--ink-muted); font-size: 14px; }
    .dias-lugar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-muted); }
    .btn-dia { padding: 7px 12px; font-size: 13px; text-transform: capitalize; }
    .trampa { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--ink-muted); line-height: 1.55; margin-top: 4px; }
    .consent input { margin-top: 3px; accent-color: var(--c-energy); flex: 0 0 auto; }
    .consent a { color: var(--c-energy); }
    .acciones { display: flex; justify-content: flex-end; margin-top: 20px; }
    .btn {
      padding: 12px 26px; border-radius: 999px; border: 0; cursor: pointer;
      background: var(--c-energy); color: #1A1406; font-family: var(--font-body); font-size: 15px; font-weight: 600;
    }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn-sec {
      padding: 10px 18px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink);
      font-family: var(--font-body); font-size: 14px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .error { color: #F08A73; font-size: 14px; margin-top: 12px; min-height: 1em; }

    .enviada h2 { color: var(--c-energy); }
    .liga {
      display: flex; gap: 8px; align-items: center; margin: 16px 0; padding: 10px 12px; background: var(--bg-alt);
      border: 1px dashed rgba(232,163,61,0.4); border-radius: 8px; font-family: var(--font-mono); font-size: 12px; overflow-wrap: anywhere;
    }
    .botones { display: flex; gap: 10px; flex-wrap: wrap; }

    @media (max-width: 639px) {
      header { padding: 14px 16px; }
      main { padding: 24px 16px 60px; }
      .ficha, .solicitud { padding: 22px 18px; }
      .ficha__top { flex-direction: column; text-align: center; gap: 16px; }
      .filas { width: fit-content; max-width: 100%; margin-inline: auto; }
      .rejilla { grid-template-columns: 1fr; }
      .acciones .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">CODE CELLS™</a>
    <a href="/directorio/" class="volver">← Directorio</a>
  </header>

  <main id="contenido">
    <div class="estado-pagina">Cargando perfil…</div>
  </main>

  <script>
    const ICONO_ATR = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"';
    const ICONOS = {
      especialidad: `<svg ${ICONO_ATR}><path d="M12 5v14M5 12h14"/></svg>`,
      ubicacion: `<svg ${ICONO_ATR}><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>`,
      reloj: `<svg ${ICONO_ATR}><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>`,
      telefono: `<svg ${ICONO_ATR}><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>`,
      candado: `<svg ${ICONO_ATR}><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`,
      whatsapp: `<svg ${ICONO_ATR} width="16" height="16"><path d="M4 20l1.3-3.9A8.5 8.5 0 1 1 8 18.8z"/></svg>`,
    };
    // Íconos de línea propios (sin cargar logos de terceros).
    const REDES = [
      { campo: 'Instagram', icono: `<svg ${ICONO_ATR}><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="0.6" fill="currentColor"/></svg>` },
      { campo: 'Facebook', icono: `<svg ${ICONO_ATR}><path d="M14.5 21v-7.5h2.6l.4-3h-3V8.6c0-.9.3-1.6 1.6-1.6h1.5V4.3a20 20 0 0 0-2.3-.1c-2.3 0-3.8 1.4-3.8 3.9v2.4H9v3h2.5V21"/></svg>` },
      { campo: 'TikTok', icono: `<svg ${ICONO_ATR}><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.4 2.6 2.2 4.4 5 4.6"/></svg>` },
      { campo: 'YouTube', icono: `<svg ${ICONO_ATR}><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10.5 9.5v5l4-2.5z" fill="currentColor"/></svg>` },
      { campo: 'LinkedIn', icono: `<svg ${ICONO_ATR}><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 10.5V16M8 7.8v.1M11.5 16v-5.5M11.5 13c0-1.5 1-2.5 2.3-2.5s2.2.9 2.2 2.5V16"/></svg>` },
      { campo: 'Sitio web', icono: `<svg ${ICONO_ATR}><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.2 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.2-3.5-8.5s1.2-6.1 3.5-8.5z"/></svg>` },
    ];
    // El servidor ya filtró las ligas; aquí se vuelve a exigir https por si acaso.
    function htmlRedes(f, nombre) {
      const items = REDES.filter(r => /^https:\/\//i.test(f[r.campo] || '')).map(r =>
        `<li><a href="${esc(f[r.campo])}" target="_blank" rel="noopener noreferrer nofollow" aria-label="${esc(r.campo)} de ${esc(nombre)} (se abre en otra pestaña)">${r.icono}<span>${esc(r.campo)}</span></a></li>`);
      return items.length ? `<ul class="redes">${items.join('')}</ul>` : '';
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function iniciales(nombre) {
      const p = String(nombre || '').replace(/\[[^\]]*\]/g, ' ').split(/\s+/).filter(x => x && !/^(dr|dra|doctor|doctora)\.?$/i.test(x));
      return p.slice(0, 2).map(x => x[0].toUpperCase()).join('') || '·';
    }
    const fila = (icono, html, clase) => `<li class="fila${clase ? ' ' + clase : ''}"><span class="icono">${icono}</span><span>${html}</span></li>`;
    const leer = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
    const guardar = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } };

    // Fechas en hora de México: mañana y +90 días (mismo límite que el servidor).
    function ymdMexico(dias) {
      const hoy = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Mexico_City', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
      const d = new Date(hoy + 'T12:00:00Z');
      d.setUTCDate(d.getUTCDate() + dias);
      return d.toISOString().slice(0, 10);
    }

    const ID = new URLSearchParams(location.search).get('id') || '';
    let MEDICO = null;
    // Agenda automática (etapa 2b): { automatica, siguientes, … } | { error: true } si no se pudo leer.
    let AGENDA = null;

    const fechaLarga = ymd => new Date(ymd + 'T12:00:00Z').toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' });
    const horaCorta = h => String(h).replace(/^0(\d)/, '$1');

    async function cargarDisponibilidad(fecha) {
      try {
        const r = await fetch('/api/citas?accion=disponibilidad&medicoId=' + encodeURIComponent(ID) + (fecha ? '&fecha=' + encodeURIComponent(fecha) : ''));
        const d = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(d.error || 'Error ' + r.status);
        return d;
      } catch (e) {
        return { error: true };
      }
    }

    async function cargarContactos() {
      const token = leer('cc_visitante');
      if (!token) return { tel: null, wa: null, error: false };
      try {
        const r = await fetch('/api/airtable?tabla=directorio_medico&accion=contactos', { headers: { Authorization: 'Bearer ' + token } });
        if (r.status === 401) return { tel: null, wa: null, error: false, vencido: true };
        const d = await r.json().catch(() => ({}));
        if (!r.ok) return { tel: null, wa: null, error: true };
        return { tel: (d.contactos || {})[ID] || null, wa: (d.whatsapp || {})[ID] || null, error: false };
      } catch (e) {
        return { tel: null, wa: null, error: true };
      }
    }

    async function cargar() {
      const cont = document.getElementById('contenido');
      if (!/^rec[A-Za-z0-9]{14}$/.test(ID)) {
        cont.innerHTML = '<div class="estado-pagina"><h1>Perfil no encontrado</h1><p>La liga está incompleta. <a href="/directorio/">Volver al directorio</a></p></div>';
        return;
      }
      try {
        const r = await fetch('/api/airtable?tabla=directorio_medico&id=' + encodeURIComponent(ID));
        if (!r.ok) throw new Error('Error ' + r.status);
        const d = await r.json();
        MEDICO = (d.records || [])[0] || null;
      } catch (e) {
        cont.innerHTML = '<div class="estado-pagina"><h1>No pudimos cargar el perfil</h1><p>Hubo un problema de conexión. Recarga la página en unos segundos.</p></div>';
        return;
      }
      if (!MEDICO) {
        cont.innerHTML = '<div class="estado-pagina"><h1>Este médico no está en el directorio</h1><p>Puede que haya retirado su perfil. <a href="/directorio/">Buscar otro médico</a></p></div>';
        return;
      }
      const [contactos, agenda] = await Promise.all([cargarContactos(), cargarDisponibilidad()]);
      AGENDA = agenda;
      render(contactos);
      if (location.hash === '#solicitar') document.getElementById('solicitar').scrollIntoView({ behavior: 'smooth' });
    }

    function render(ct) {
      const f = MEDICO.fields || {};
      const nombre = f['Name'] || 'Médico';
      document.title = nombre + ' — Red CODE CELLS™';
      const foto = /^https:\/\//.test(f['Foto de perfil'] || '') ? f['Foto de perfil'] : '';
      const esp = (f['Especialidades visibles'] || []).map(esc).join(' · ');
      const trat = f['Tratamientos que ofrece'] || [];
      const tieneToken = !!leer('cc_visitante') && !ct.vencido;
      const filas = [
        esp && fila(ICONOS.especialidad, esp),
        f['Ciudad de consulta'] && fila(ICONOS.ubicacion, esc(f['Ciudad de consulta'])),
        f['Horarios'] && fila(ICONOS.reloj, esc(f['Horarios'])),
        ct.tel && fila(ICONOS.telefono, esc(ct.tel), 'fila--tel'),
        (tieneToken && ct.error) && fila(ICONOS.telefono, 'No pudimos cargar el teléfono. Recarga en unos segundos.', 'fila--aviso'),
        !tieneToken && fila(ICONOS.candado, 'El teléfono se muestra después de enviar tu solicitud.', 'fila--aviso'),
      ].filter(Boolean).join('');

      document.getElementById('contenido').innerHTML = `
        <article class="ficha">
          <div class="ficha__top">
            <div class="avatar">
              <span aria-hidden="true">${esc(iniciales(nombre))}</span>
              ${foto ? `<img src="${esc(foto)}" alt="Foto de ${esc(nombre)}" onerror="this.remove()">` : ''}
            </div>
            <div>
              <h1>${esc(nombre)}</h1>
              ${f['Ciudad de consulta'] ? `<div class="ciudad">${esc(f['Ciudad de consulta'])}</div>` : ''}
            </div>
          </div>
          ${filas ? `<ul class="filas">${filas}</ul>` : ''}
          ${htmlRedes(f, nombre)}
          ${ct.wa && tieneToken ? `<a class="wa" href="${esc(ct.wa)}" target="_blank" rel="noopener">${ICONOS.whatsapp} WhatsApp del consultorio</a>` : ''}
          ${f['Bio corta'] ? `<section class="seccion"><h2>Presentación</h2><p class="bio">${esc(f['Bio corta'])}</p></section>` : ''}
          ${trat.length ? `<section class="seccion"><h2>Herramientas que ofrece</h2><ul class="chips">${trat.map(t => `<li class="chip">${esc(t)}</li>`).join('')}</ul></section>` : ''}
          ${f['Otras terapias'] ? `<section class="seccion"><h2>Otras terapias</h2><p class="bio">${esc(f['Otras terapias'])}</p></section>` : ''}
          <p class="legal">Este perfil no sustituye la consulta médica. El médico declara bajo su responsabilidad las herramientas que ofrece.</p>
        </article>

        <section class="solicitud" id="solicitar">
          ${htmlFormulario(nombre)}
        </section>`;
    }

    // Campos comunes a los dos formularios (agenda automática y solicitud).
    const camposPaciente = `
            <div class="campo"><label for="c-nombre">Tu nombre *</label><input id="c-nombre" type="text" autocomplete="name" maxlength="120" required></div>
            <div class="campo"><label for="c-telefono">Teléfono o WhatsApp *</label><input id="c-telefono" type="tel" autocomplete="tel" maxlength="30" required></div>
            <div class="campo"><label for="c-email">Correo (opcional)</label><input id="c-email" type="email" autocomplete="email" maxlength="120"></div>`;

    function htmlDiasConLugar(siguientes, excepto) {
      const lista = (siguientes || []).filter(s => s.fecha !== excepto);
      if (!lista.length) return '';
      return `<div class="dias-lugar"><span>Días con lugar:</span>${lista.map(s =>
        `<button type="button" class="btn-sec btn-dia" data-fecha="${esc(s.fecha)}">${esc(fechaLarga(s.fecha))}</button>`).join('')}</div>`;
    }

    function htmlEspacios(d, fecha) {
      if (!fecha) return `<p class="nota-chica">Elige un día para ver los horarios libres.</p>${htmlDiasConLugar(AGENDA.siguientes)}`;
      if (d.error) return '<p class="error">No pudimos cargar los horarios. Revisa tu conexión e intenta de nuevo.</p>';
      if (!d.espacios || !d.espacios.length) return `<p class="nota-chica">No hay horarios libres el ${esc(fechaLarga(fecha))}.</p>${htmlDiasConLugar(d.siguientes, fecha)}`;
      return `<div class="turnos">${d.espacios.map(h =>
        `<label><input type="radio" name="hora" value="${esc(h)}"> ${esc(horaCorta(h))}</label>`).join('')}</div>`;
    }

    async function elegirFecha(fecha) {
      const cont = document.getElementById('c-espacios');
      const input = document.getElementById('c-fecha');
      if (!cont) return;
      if (input && input.value !== fecha) input.value = fecha;
      cont.innerHTML = '<p class="nota-chica">Buscando horarios…</p>';
      const d = await cargarDisponibilidad(fecha);
      if (input && input.value !== fecha) return; // el paciente ya eligió otro día
      cont.innerHTML = htmlEspacios(d, fecha);
    }

    function htmlFormulario(nombre) {
      if (AGENDA && AGENDA.error) {
        return `<h2>Agendar cita</h2>
          <p class="error">No pudimos cargar la agenda de ${esc(nombre)}. Recarga la página en unos segundos.</p>`;
      }
      if (AGENDA && AGENDA.automatica) {
        return `
        <h2>Agendar cita</h2>
        <p class="nota">Elige el día y la hora: verás solo los horarios libres de ${esc(nombre)} y tu cita queda <strong>confirmada al momento</strong>.</p>
        <form id="form-cita" novalidate>
          <div class="rejilla">
            ${camposPaciente}
            <div class="campo"><label for="c-fecha">Día *</label><input id="c-fecha" type="date" min="${ymdMexico(1)}" max="${ymdMexico(90)}" required></div>
            <fieldset class="campo campo--ancho">
              <legend>Hora *</legend>
              <div id="c-espacios">${htmlEspacios({}, '')}</div>
            </fieldset>
            ${camposFinales('Agendar cita')}
        </form>`;
      }
      return `
        <h2>Solicitar cita</h2>
        <p class="nota">Esto es una <strong>solicitud</strong>, todavía no una cita. ${esc(nombre)} la revisará y podrá aceptarla, proponerte otro horario o avisarte si no puede atenderte. Verás la respuesta en una liga que te daremos al enviar.</p>
        <form id="form-cita" novalidate>
          <div class="rejilla">
            ${camposPaciente}
            <div class="campo"><label for="c-fecha">Fecha que prefieres *</label><input id="c-fecha" type="date" min="${ymdMexico(1)}" max="${ymdMexico(90)}" required></div>
            <fieldset class="campo campo--ancho">
              <legend>Horario que prefieres *</legend>
              <div class="turnos">
                <label><input type="radio" name="turno" value="Mañana"> Mañana</label>
                <label><input type="radio" name="turno" value="Tarde"> Tarde</label>
                <label><input type="radio" name="turno" value="Cualquiera" checked> Cualquiera</label>
              </div>
            </fieldset>
            ${camposFinales('Enviar solicitud')}
        </form>`;
    }

    // Motivo, campo trampa, consentimiento y botón; cierra la rejilla.
    function camposFinales(textoBoton) {
      return `
            <div class="campo campo--ancho"><label for="c-motivo">¿Qué te gustaría atender? (opcional)</label><textarea id="c-motivo" maxlength="1000" placeholder="Describe brevemente lo que buscas"></textarea></div>
            <div class="trampa" aria-hidden="true"><label for="c-sitio">No llenar</label><input id="c-sitio" type="text" tabindex="-1" autocomplete="off"></div>
          </div>
          <div class="consent">
            <input type="checkbox" id="c-consent">
            <label for="c-consent">Autorizo que CODE CELLS™ trate mis datos, incluida la información de salud que yo decida escribir, y la comparta con el médico que seleccioné, conforme al <a href="/aviso-privacidad" target="_blank" rel="noopener">Aviso de Privacidad</a>. Puedo enviar mi solicitud sin marcar esta casilla; en ese caso no se guardará lo que escribí sobre lo que quiero atender.</label>
          </div>
          <div class="acciones"><button type="submit" class="btn" id="c-enviar">${textoBoton}</button></div>
          <div class="error" id="c-error" role="alert"></div>`;
    }

    async function enviar(ev) {
      ev.preventDefault();
      const btn = document.getElementById('c-enviar');
      const err = document.getElementById('c-error');
      const auto = !!(AGENDA && AGENDA.automatica);
      const textoBoton = auto ? 'Agendar cita' : 'Enviar solicitud';
      const turno = (document.querySelector('input[name="turno"]:checked') || {}).value || '';
      const hora = (document.querySelector('input[name="hora"]:checked') || {}).value || '';
      const datos = {
        medicoId: ID,
        nombre: document.getElementById('c-nombre').value.trim(),
        telefono: document.getElementById('c-telefono').value.trim(),
        email: document.getElementById('c-email').value.trim(),
        fechaPreferida: document.getElementById('c-fecha').value,
        ...(auto ? { hora } : { turno }),
        motivo: document.getElementById('c-motivo').value.trim(),
        consentimiento: document.getElementById('c-consent').checked,
        sitio: document.getElementById('c-sitio').value,
      };
      if (!datos.nombre || !datos.telefono) { err.textContent = 'Escribe tu nombre y teléfono.'; return; }
      if (!datos.fechaPreferida) { err.textContent = auto ? 'Elige el día.' : 'Elige la fecha que prefieres.'; return; }
      if (auto && !hora) { err.textContent = 'Elige la hora.'; return; }
      err.textContent = '';
      btn.disabled = true;
      btn.textContent = auto ? 'Agendando…' : 'Enviando…';
      try {
        const r = await fetch('/api/citas?accion=solicitar', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(datos),
        });
        const d = await r.json().catch(() => ({}));
        // Alguien más tomó ese horario: se refrescan los espacios del día.
        if (r.status === 409 && auto && Array.isArray(d.espacios)) {
          document.getElementById('c-espacios').innerHTML = htmlEspacios({ espacios: d.espacios, siguientes: AGENDA.siguientes }, datos.fechaPreferida);
        }
        if (!r.ok) throw new Error(d.error || 'No pudimos enviar tu solicitud. Intenta de nuevo.');
        if (d.token) guardar('cc_visitante', d.token);
        const liga = `${location.origin}/directorio/solicitud.html#id=${encodeURIComponent(d.id)}&c=${encodeURIComponent(d.clave)}`;
        try {
          const previas = JSON.parse(localStorage.getItem('cc_mis_solicitudes') || '[]');
          previas.unshift({ liga, medico: (MEDICO.fields || {})['Name'] || '', fecha: datos.fechaPreferida });
          localStorage.setItem('cc_mis_solicitudes', JSON.stringify(previas.slice(0, 10)));
        } catch (e) { /* sin almacenamiento: la liga se muestra igual */ }
        // Ya con token de visitante, la ficha muestra el teléfono; el panel de
        // "enviada" reemplaza al formulario.
        const ct = await cargarContactos();
        render(ct);
        mostrarEnviada(liga, d);
        document.getElementById('solicitar').scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
        btn.textContent = textoBoton;
      }
    }

    function mostrarEnviada(liga, d) {
      const nombre = (MEDICO.fields || {})['Name'] || 'el médico';
      // Solo se dice "confirmada" si el servidor la guardó como Aceptada con horario.
      const confirmada = d && d.estado === 'Aceptada' && /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(d.horario || '');
      const textoWa = encodeURIComponent((confirmada ? 'Mi cita en CODE CELLS: ' : 'Mi solicitud de cita en CODE CELLS: ') + liga);
      const cabecera = confirmada
        ? `<h2>Cita confirmada</h2>
          <p class="nota">Tu cita con ${esc(nombre)} es el <strong>${esc(fechaLarga(d.horario.slice(0, 10)))} a las ${esc(horaCorta(d.horario.slice(11)))}</strong>. Si no puedes asistir, cancélala desde la liga de abajo para liberar el espacio.</p>
          <p style="margin:0;color:var(--ink-muted);font-size:14px">Guarda esta liga. Es personal: quien la tenga puede ver y cancelar tu cita.</p>`
        : `<h2>Solicitud enviada</h2>
          <p class="nota">Tu solicitud llegó a ${esc(nombre)}. <strong>Todavía no es una cita confirmada.</strong> La respuesta del médico (aceptarla, proponerte otro horario o avisarte si no puede) aparecerá en la liga de abajo; el médico también puede llamarte o escribirte.</p>
          <p style="margin:0;color:var(--ink-muted);font-size:14px">Guarda esta liga para ver la respuesta. Es personal: quien la tenga puede ver y cancelar tu solicitud.</p>`;
      document.getElementById('solicitar').innerHTML = `
        <div class="enviada">
          ${cabecera}
          <div class="liga" id="liga-texto">${esc(liga)}</div>
          <div class="botones">
            <a class="btn-sec" href="${esc(liga)}">${confirmada ? 'Ver mi cita' : 'Ver estado de mi solicitud'}</a>
            <button type="button" class="btn-sec" id="btn-copiar">Copiar liga</button>
            <a class="btn-sec" href="https://wa.me/?text=${textoWa}" target="_blank" rel="noopener">${ICONOS.whatsapp} Enviármela por WhatsApp</a>
          </div>
        </div>`;
      document.getElementById('btn-copiar').addEventListener('click', async ev => {
        try { await navigator.clipboard.writeText(liga); ev.target.textContent = 'Liga copiada'; }
        catch (e) { ev.target.textContent = 'Selecciona la liga y cópiala'; }
      });
    }

    document.addEventListener('submit', ev => { if (ev.target.id === 'form-cita') enviar(ev); });
    document.addEventListener('change', ev => {
      if (ev.target.id === 'c-fecha' && AGENDA && AGENDA.automatica && ev.target.value) elegirFecha(ev.target.value);
    });
    document.addEventListener('click', ev => {
      const b = ev.target.closest('.btn-dia');
      if (b) elegirFecha(b.dataset.fecha);
    });
    cargar();
  </script>
</body>
</html>
