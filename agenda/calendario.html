<!-- agenda/calendario.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Citas - CODE CELLS™</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="./css/agenda.css">
</head>
<body>
  <div id="app" class="agenda-container">
    <!-- Header -->
    <header class="agenda-header">
      <div class="header-left">
        <h1>📅 Mis Citas</h1>
        <button id="btnVolverPortal" class="btn-link">← Volver al Portal</button>
      </div>
      <div class="header-right">
        <button id="btnNovaChat" class="btn btn-primary">💬 Crear cita con NOVA</button>
      </div>
    </header>

    <!-- Controles -->
    <div class="agenda-controls">
      <div class="controls-left">
        <button data-view="mes" class="view-btn active">📅 Mes</button>
        <button data-view="semana" class="view-btn">📆 Semana</button>
      </div>
      <div class="controls-center">
        <input type="month" id="selectMes" class="mes-input">
      </div>
      <div class="controls-right">
        <select id="selectEstatus" class="estatus-filter">
          <option value="">Todos los estados</option>
          <option value="scheduled">Programadas</option>
          <option value="completed">Completadas</option>
          <option value="no_show">No presentadas</option>
          <option value="cancelled">Canceladas</option>
        </select>
      </div>
    </div>

    <!-- Calendario visual -->
    <div class="calendario-main">
      <div id="calendar" class="calendar-grid"></div>
    </div>

    <!-- Panel NOVA Chat (sidebar) -->
    <aside id="novaPanel" class="nova-panel">
      <div class="nova-header">
        <h3>NOVA Asistente</h3>
        <button id="btnCloseNova" class="btn-close">✕</button>
      </div>
      <div id="novaChat" class="nova-chat-container">
        <div class="nova-welcome">
          <p>Hola, soy NOVA 🤖</p>
          <p>Puedo ayudarte a:</p>
          <ul>
            <li>Crear nuevas citas</li>
            <li>Modificar citas existentes</li>
            <li>Cancelar citas</li>
            <li>Ver tu agenda próxima</li>
          </ul>
          <p style="margin-top: 1rem; font-size: 0.9rem; color: #999;">
            Prueba: "Crea una cita para Carlos el viernes a las 10am"
          </p>
        </div>
      </div>
      <form id="novaForm" class="nova-form" onsubmit="enviarMensajeNova(event)">
        <input 
          id="novaInput" 
          type="text" 
          placeholder="Escribe tu solicitud..." 
          autocomplete="off"
        >
        <button type="submit" class="btn-send">Enviar</button>
      </form>
    </aside>

    <!-- Modal: Detalles de cita -->
    <dialog id="modalCita" class="modal-cita">
      <div class="modal-content">
        <button class="btn-close" onclick="cerrarModal('modalCita')">✕</button>
        <div id="modalCitaContent"></div>
      </div>
    </dialog>
  </div>

  <!-- Scripts -->
  <script src="../lib/auth.js"></script>
  <script src="./js/agenda-api.js"></script>
  <script src="./js/agenda-app.js"></script>
</body>
</html>
