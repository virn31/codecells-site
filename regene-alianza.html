<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODE CELLS® × Regene Global — Alianza Estratégica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1410; --surface:#1A211B; --surface-2:#202820;
  --ink:#F2EFE6; --ink-muted:#A9B3A4; --ink-dim:#6E786C;
  --line:rgba(242,239,230,0.12); --line-strong:rgba(242,239,230,0.22);
  --gold:#C9A96E; --gold-soft:rgba(201,169,110,0.14); --gold-line:rgba(201,169,110,0.35);
  --teal:#4FA8A0;
  --font-display:"Fraunces",serif; --font-title:"Syncopate",sans-serif;
  --font-body:"IBM Plex Sans",sans-serif; --font-mono:"IBM Plex Mono",monospace;
  --ease:cubic-bezier(.16,.84,.44,1);
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;}}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);}
body{font-family:var(--font-body);font-weight:300;color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
a{color:inherit;text-decoration:none;}
img{display:block;max-width:100%;}

/* ambient */
.bg-cells{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.bg-cells span{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.12;animation:drift 55s ease-in-out infinite;}
.bg-cells span:nth-child(1){width:38vw;height:38vw;background:var(--gold);top:-8%;left:-6%;}
.bg-cells span:nth-child(2){width:30vw;height:30vw;background:var(--teal);top:20%;right:-10%;animation-delay:-14s;}
.bg-cells span:nth-child(3){width:34vw;height:34vw;background:var(--gold);bottom:-10%;left:20%;animation-delay:-28s;}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(4%,5%) scale(1.08);}}

/* progress */
#prog{position:fixed;top:0;left:0;right:0;z-index:200;height:1.5px;background:var(--line);}
#prog-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .6s var(--ease);width:0%;}

/* entry */
#entry{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#152019 0%,var(--bg) 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  transition:opacity .9s var(--ease),visibility .9s;}
#entry.hide{opacity:0;visibility:hidden;pointer-events:none;}
.entry-logos{display:flex;align-items:center;justify-content:center;gap:clamp(1.2rem,3.5vw,2.6rem);margin-bottom:2.6rem;flex-wrap:wrap;}
.entry-logos img{height:clamp(110px,17vw,190px);width:auto;object-fit:contain;opacity:1;}
.entry-logos img:not(.badge){filter:drop-shadow(0 0 30px rgba(201,169,110,.55)) drop-shadow(0 0 8px rgba(201,169,110,.7));}
.entry-logos img.badge{border-radius:clamp(16px,2.2vw,26px);box-shadow:0 0 0 1.5px var(--gold-line),0 0 50px rgba(201,169,110,.35),0 20px 45px rgba(0,0,0,.55);}
.entry-logos .x{font-family:var(--font-display);font-style:italic;font-size:clamp(1.5rem,3.2vw,2.3rem);color:var(--gold);opacity:.9;text-shadow:0 0 22px rgba(201,169,110,.55);}
.entry-eyebrow{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:1.1rem;}
.entry-h1{font-family:var(--font-title);font-weight:700;font-size:clamp(1.3rem,3.4vw,2.2rem);letter-spacing:.07em;text-transform:uppercase;margin-bottom:.6rem;max-width:800px;}
.entry-sub{font-family:var(--font-display);font-style:italic;font-weight:300;font-size:clamp(.95rem,2vw,1.2rem);color:var(--ink-muted);margin-bottom:2.6rem;}
#btnStart{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--bg);padding:1rem 1.9rem;border-radius:100px;transition:transform .35s var(--ease),background .35s var(--ease);display:inline-flex;align-items:center;gap:.6rem;}
#btnStart:hover{transform:translateY(-2px);background:#fff;}
.entry-note{margin-top:1.3rem;font-family:var(--font-mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);}

/* slides */
#slides{position:fixed;inset:0;z-index:1;}
.slide{position:absolute;inset:0;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1s var(--ease),visibility 1s;}
.slide.active{opacity:1;visibility:visible;pointer-events:all;}
.s-bg{position:absolute;inset:0;background-size:cover;background-position:center;background-color:#12180f;
  transform:scale(1.04);transition:transform 16s ease-out;}
.slide.active .s-bg{transform:scale(1);}
.s-bg.crossfade-b{opacity:0;transition:opacity 5s ease-in-out,transform 16s ease-out;}
.slide.active .s-bg.crossfade-b{opacity:1;transition-delay:14s,0s;}
.s-ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,20,16,.45) 0%,rgba(14,20,16,.22) 36%,rgba(14,20,16,.6) 66%,rgba(14,20,16,.96) 100%);}
.s-content{position:relative;z-index:2;width:100%;max-width:980px;padding:clamp(1.5rem,4vw,3rem);
  padding-bottom:clamp(7rem,15vh,11rem);margin:0 auto;height:100%;display:flex;flex-direction:column;justify-content:flex-end;}
.s-content.centered{align-items:center;justify-content:center;text-align:center;}
.s-eyebrow{font-family:var(--font-mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:1.1rem;display:flex;align-items:center;gap:.5rem;}
.s-eyebrow::before{content:'';display:inline-block;width:18px;height:1px;background:var(--gold);opacity:.7;flex-shrink:0;}
.s-eyebrow .accent{color:var(--gold);font-weight:700;letter-spacing:.1em;}
.s-title{font-family:var(--font-title);font-weight:700;font-size:clamp(1.35rem,3.1vw,2.3rem);line-height:1.15;letter-spacing:.05em;text-transform:uppercase;margin-bottom:1rem;}
.s-title em{font-family:var(--font-display);font-style:italic;font-weight:300;color:var(--gold);letter-spacing:0;text-transform:none;font-size:.9em;}
.s-body{color:var(--ink-muted);font-size:clamp(.92rem,1.3vw,1.02rem);line-height:1.85;max-width:56ch;font-weight:300;}
.s-content.centered .s-body{margin:0 auto;}
.s-line{width:38px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:1.3rem 0;opacity:.8;}
.s-content.centered .s-line{margin:1.3rem auto;}

/* gallery slides (paciente / médico) */
.s-gallery{display:grid;gap:.9rem;margin-top:1.2rem;max-width:920px;}
.s-gallery.g4{grid-template-columns:repeat(2,1fr);}
.s-gallery.g3{grid-template-columns:repeat(3,1fr);}
.g-frame{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line-strong);
  background:var(--surface);aspect-ratio:16/10;box-shadow:0 12px 30px rgba(0,0,0,.35);}
.g-frame img{width:100%;height:100%;object-fit:cover;object-position:top;}
.g-frame .g-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:.4rem;color:var(--ink-dim);font-family:var(--font-mono);font-size:.62rem;
  letter-spacing:.06em;text-align:center;padding:1rem;background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.02),rgba(255,255,255,.02) 10px,transparent 10px,transparent 20px);}
.g-cap{position:absolute;bottom:0;left:0;right:0;padding:.5rem .7rem;font-family:var(--font-mono);
  font-size:.6rem;letter-spacing:.05em;color:var(--ink-muted);background:linear-gradient(0deg,rgba(14,20,16,.9),transparent);}

/* dots */
#dots{position:fixed;bottom:4.5rem;left:50%;transform:translateX(-50%);z-index:50;display:flex;gap:.55rem;align-items:center;transition:opacity .4s;}
.dot{width:5px;height:5px;border-radius:50%;background:var(--line-strong);transition:all .4s var(--ease);cursor:pointer;}
.dot.on{background:var(--ink);transform:scale(1.5);}

/* audio bar */
#abar{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:.85rem clamp(1rem,4vw,2.5rem);
  background:linear-gradient(180deg,transparent,rgba(14,20,16,.97));display:flex;align-items:center;gap:1rem;transition:opacity .5s;}
#ppBtn{width:34px;height:34px;border-radius:50%;flex-shrink:0;border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(242,239,230,.04);}
#ppBtn svg{width:12px;height:12px;fill:var(--ink-muted);}
.a-track{flex:1;height:1.5px;background:var(--line);border-radius:2px;cursor:pointer;position:relative;overflow:hidden;}
.a-fill{position:absolute;left:0;top:0;height:100%;width:0%;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .25s linear;}
#a-time{font-family:var(--font-mono);font-size:.6rem;color:var(--ink-dim);letter-spacing:.04em;flex-shrink:0;min-width:32px;text-align:right;}
#skip-btn{font-family:var(--font-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);cursor:pointer;flex-shrink:0;}
#skip-btn:hover{color:var(--ink-muted);}

/* nav */
#nav-prev{position:fixed;left:clamp(.8rem,2.5vw,1.8rem);top:50%;transform:translateY(-50%);z-index:50;width:40px;height:40px;
  border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(14,20,16,.7);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:all .3s var(--ease);}
#nav-prev.show{opacity:1;pointer-events:all;}
#nav-prev svg{width:14px;height:14px;stroke:var(--ink-muted);fill:none;stroke-width:1.5;}
#btn-next{position:fixed;right:clamp(.8rem,2.5vw,1.8rem);top:50%;transform:translateY(-50%);z-index:50;
  font-family:var(--font-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line-strong);border-radius:100px;padding:.85rem 1.55rem;color:var(--ink-muted);
  cursor:pointer;background:rgba(14,20,16,.8);backdrop-filter:blur(8px);display:flex;align-items:center;gap:.55rem;
  opacity:0;pointer-events:none;transition:all .4s var(--ease);}
#btn-next.show{opacity:1;pointer-events:all;}
#btn-next:hover{border-color:var(--ink);color:var(--ink);}

/* finale reveal */
.finale-wrap{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;height:100%;padding:2rem;}
.finale-eyebrow{font-family:var(--font-mono);font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:1.4rem;opacity:0;animation:fadeUp 1s .3s forwards;}
.finale-title{font-family:var(--font-display);font-weight:300;font-size:clamp(1.8rem,5vw,3.2rem);line-height:1.15;margin-bottom:1.6rem;opacity:0;animation:fadeUp 1s .6s forwards;}
.finale-title em{font-style:italic;color:var(--gold);}
#dezawaBtn{opacity:0;animation:fadeUp 1s 1.1s forwards;font-family:var(--font-mono);font-size:.78rem;letter-spacing:.08em;
  text-transform:uppercase;background:var(--gold);color:#1B1710;padding:1.1rem 2rem;border-radius:100px;
  display:inline-flex;align-items:center;gap:.7rem;box-shadow:0 0 40px rgba(201,169,110,.25);
  transition:transform .35s var(--ease),box-shadow .35s var(--ease);}
#dezawaBtn:hover{transform:translateY(-2px);box-shadow:0 0 55px rgba(201,169,110,.4);}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

/* mobile */
@media(max-width:640px){
  .s-gallery.g4{grid-template-columns:repeat(2,1fr);}
  .s-gallery.g3{grid-template-columns:1fr;}
  #btn-next{right:.5rem;font-size:.6rem;padding:.65rem 1rem;top:auto;bottom:5rem;transform:none;}
  #nav-prev{left:.5rem;top:auto;bottom:5rem;transform:none;}
  .s-content{padding:1rem;padding-bottom:9rem;}
}
</style>
</head>
<body>

<div class="bg-cells" aria-hidden="true"><span></span><span></span><span></span></div>
<div id="prog"><div id="prog-fill"></div></div>

<!-- ENTRY -->
<div id="entry">
  <div class="entry-logos">
    <img src="assets/img/logo-codecells.png" alt="Code Cells" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'">
    <span style="display:none;font-family:var(--font-title);font-weight:700;letter-spacing:.1em;">CODE CELLS</span>
    <img class="badge" src="assets/img/logo-regeneglobal.png" alt="Regene Global" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline'">
    <span style="display:none;font-family:var(--font-title);font-weight:700;letter-spacing:.1em;">REGENE GLOBAL</span>
  </div>
  <p class="entry-eyebrow">Reunión estratégica · Propuesta de alianza</p>
  <h1 class="entry-h1">Una alianza para escalar la medicina regenerativa en México</h1>
  <button id="btnStart" onclick="start()">Iniciar experiencia &nbsp;→</button>
  <p class="entry-note">Duración aproximada: 5 minutos</p>
</div>

<div id="slides"></div>

<div id="nav-prev" onclick="prevSlide()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></div>
<button id="btn-next" onclick="nextSlide()">Continuar &nbsp;→</button>
<div id="dots"></div>

<div id="abar">
  <div id="ppBtn" onclick="toggleAudio()">
    <svg id="i-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    <svg id="i-pause" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
  </div>
  <div class="a-track" onclick="seekAudio(event)"><div class="a-fill" id="a-fill"></div></div>
  <div id="a-time">0:00</div>
  <div id="skip-btn" onclick="skipAudio()">Saltar ›</div>
</div>

<audio id="player" preload="auto"></audio>
<audio id="bgMusic" preload="auto" loop></audio>

<script>
// ══════════════════════════════════════════════════════════
// CONFIGURA AQUÍ LA URL REAL DE LA INVITACIÓN DEZAWA VIP
// ══════════════════════════════════════════════════════════
const DEZAWA_URL = 'https://www.codecells.mx/dezawavip.html?demo=1&from=victor';

// ── DATA: 8 actos ─────────────────────────────────────────
const SLIDES = [
  {
    id:0, type:'standard', centered:true,
    bg:'assets/img/01-bg.jpg',
    eyebrow:'Apertura',
    title:'CODE CELLS<em>®</em> · Regene Global',
    body:'Dos empresas... un mismo propósito. Construyendo juntos el futuro de la medicina regenerativa en México.',
    audio:'assets/audio/01-apertura.mp3'
  },
  {
    id:1, type:'standard',
    bg:'assets/img/02-bg.jpg',
    eyebrow:'01 · ¿Qué es CODE CELLS?',
    title:'Una red, <em>no una clínica.</em>',
    body:'CODE CELLS es una red de medicina biológica: especialistas certificados en terapias regenerativas, longevidad y bienestar celular. Está pensada para el paciente que busca una alternativa real, y el médico que quiere ofrecerla con protocolos serios y una marca confiable.',
    audio:'assets/audio/02-que-es.mp3'
  },
  {
    id:2, type:'gallery', gcols:4,
    eyebrow:'02 · El viaje del paciente',
    title:'De la duda... <em>al especialista correcto.</em>',
    body:'Llega al portal, hace su test biológico y conversa con NOVA. Ella escucha, entiende su caso y lo prepara antes de que hable con nadie más — y cuando está listo, lo conecta con el especialista correcto de la Red CODE CELLS®.',
    gallery:[
      {src:'assets/captures/p1-landing.png', cap:'01 · Landing'},
      {src:'assets/captures/p2-sistemas.png', cap:'02 · Los 5 sistemas'},
      {src:'assets/captures/p3-test-nova.png', cap:'03 · Test con NOVA'},
      {src:'assets/captures/p4-mapa.png', cap:'04 · Mapa biológico'}
    ],
    audio:'assets/audio/03-paciente.mp3'
  },
  {
    id:3, type:'gallery', gcols:3,
    eyebrow:'03 · El viaje del médico',
    title:'Se afilia... <em>y la red le entrega pacientes.</em>',
    body:'Entra a su portal, conversa con NOVA, y recibe su código de afiliación — pacientes ya calificados, sin que tenga que salir a buscarlos.',
    gallery:[
      {src:'assets/captures/m1-landing.png', cap:'01 · Portal médico'},
      {src:'assets/captures/m2-chat-nova.png', cap:'02 · Conversación con NOVA'},
      {src:'assets/captures/m3-codigo.png', cap:'03 · Código de afiliación'}
    ],
    audio:'assets/audio/04-medico.mp3'
  },
  {
    id:4, type:'standard',
    bg:'assets/img/05-bg.jpg',
    eyebrow:'04 · La decisión estratégica',
    title:'Por qué <em>no solo VIP.</em>',
    body:'Nació como una red cerrada, solo para pacientes VIP. Pero un paciente VIP aislado, sin red detrás, es difícil de capitalizar. Por eso construimos primero la base: volumen real y constante. Lo exclusivo llega después, sobre algo que ya sostiene un negocio.',
    audio:'assets/audio/05-decision.mp3'
  },
  {
    id:5, type:'standard-dual',
    bg:'assets/img/06-bg-a.jpg', bg2:'assets/img/06-bg-b.jpg',
    eyebrow:'05 · Lo que gana Regene Global',
    title:'De vender disperso... <em>a ser la infraestructura del sector.</em>',
    body:'Demanda recurrente de cada médico afiliado. Un canal de captación directo al paciente vía NOVA, sin invertir en marketing propio. Tracción para la Regene Academy. Y una puerta abierta hacia el resto de Latinoamérica, usando la marca CODE CELLS como punto de entrada.',
    audio:'assets/audio/06-regene.mp3'
  },
  {
    id:6, type:'standard',
    bg:'assets/img/07-bg.jpg',
    eyebrow:'06 · Cómo coexisten',
    title:'Ninguna compite. <em>Ambas se completan.</em>',
    body:'CODE CELLS construye la red, la marca y la tecnología que capta al paciente. Regene Global construye el producto, el respaldo científico y la formación médica. Juntas, la cadena completa: del paciente al tratamiento.',
    audio:'assets/audio/07-coexistencia.mp3'
  },
  {
    id:7, type:'finale',
    bg:'assets/img/08-invitacion.jpg',
    audio:'assets/audio/08-cierre.mp3'
  }
];

// ── STATE ──────────────────────────────────────────────────
let cur=0, autoAdvTm=null;
const player=document.getElementById('player');
const bgMusic=document.getElementById('bgMusic');
bgMusic.src=encodeURI('assets/audio/Helix in Gold.mp3');
bgMusic.volume=0.22;
const progFill=document.getElementById('prog-fill');
const dotsEl=document.getElementById('dots');
const navPrev=document.getElementById('nav-prev');
const btnNext=document.getElementById('btn-next');
const abar=document.getElementById('abar');
const aFill=document.getElementById('a-fill');
const aTime=document.getElementById('a-time');

function build(){
  const cont=document.getElementById('slides');
  SLIDES.forEach((s,i)=>{
    const el=document.createElement('div');
    el.className='slide'+(i===0?' active':'');

    if(s.type==='gallery'){
      const items=s.gallery.map(g=>`
        <div class="g-frame">
          <img src="${g.src}" alt="${g.cap}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
          <div class="g-placeholder" style="display:none">📸<br>${g.cap}<br><span style="opacity:.6">(sube esta captura)</span></div>
          <div class="g-cap">${g.cap}</div>
        </div>`).join('');
      el.innerHTML=`
        <div class="s-bg" style="background:linear-gradient(160deg,#141d17,#0E1410)"></div>
        <div class="s-ov"></div>
        <div class="s-content">
          <p class="s-eyebrow"><span class="accent">${(i+1).toString().padStart(2,'0')}</span> · ${s.eyebrow.split('·').pop().trim()}</p>
          <h2 class="s-title">${s.title}</h2>
          <div class="s-line"></div>
          <p class="s-body">${s.body}</p>
          <div class="s-gallery g${s.gcols}">${items}</div>
        </div>`;
    } else if(s.type==='finale'){
      el.innerHTML=`
        <div class="s-bg" style="background-image:url('${s.bg}')"></div>
        <div class="s-ov" style="background:rgba(10,10,10,.88)"></div>
        <div class="finale-wrap">
          <p class="finale-eyebrow">Han sido invitados a</p>
          <h2 class="finale-title">DEZAWA <em>VIP</em></h2>
          <a id="dezawaBtn" href="${DEZAWA_URL}" target="_blank" rel="noopener">Abrir la invitación &nbsp;→</a>
        </div>`;
    } else {
      const bg2Html = s.type==='standard-dual' ? `<div class="s-bg crossfade-b" style="background-image:url('${s.bg2}')"></div>` : '';
      const cen = s.centered ? 'centered' : '';
      el.innerHTML=`
        <div class="s-bg" style="background-image:url('${s.bg}')"></div>
        ${bg2Html}
        <div class="s-ov"></div>
        <div class="s-content ${cen}">
          <p class="s-eyebrow"><span class="accent">${(i+1).toString().padStart(2,'0')}</span> · ${s.eyebrow.split('·').pop().trim()}</p>
          <h2 class="s-title">${s.title}</h2>
          <div class="s-line"></div>
          <p class="s-body">${s.body}</p>
        </div>`;
    }
    cont.appendChild(el);
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' on':'');
    dot.onclick=()=>gotoSlide(i);
    dotsEl.appendChild(dot);
  });
}

function start(){
  document.getElementById('entry').classList.add('hide');
  bgMusic.currentTime=0;
  bgMusic.play().catch(()=>{});
  gotoSlide(0);
}

function fadeOutBgMusic(duration=1600){
  const startVol=bgMusic.volume||0.22;
  const steps=24, stepMs=duration/steps;
  let i=0;
  const iv=setInterval(()=>{
    i++;
    bgMusic.volume=Math.max(0, startVol*(1-i/steps));
    if(i>=steps){ clearInterval(iv); bgMusic.pause(); }
  }, stepMs);
}

function gotoSlide(idx){
  if(idx<0||idx>=SLIDES.length) return;
  clearTimeout(autoAdvTm);
  document.querySelectorAll('.slide')[cur].classList.remove('active');
  document.querySelectorAll('.dot')[cur].classList.remove('on');
  cur=idx;
  document.querySelectorAll('.slide')[cur].classList.add('active');
  document.querySelectorAll('.dot')[cur].classList.add('on');
  progFill.style.width=(cur/(SLIDES.length-1)*100)+'%';
  navPrev.classList.toggle('show', cur>0);
  btnNext.classList.remove('show');
  if(SLIDES[cur].type==='finale'){ fadeOutBgMusic(); }
  playSlideAudio(cur);
}
function nextSlide(){ gotoSlide(cur+1); }
function prevSlide(){ gotoSlide(cur-1); }

function playSlideAudio(idx){
  const s=SLIDES[idx];
  player.pause();
  if(!s.audio){ showContinue(); return; }
  player.src=s.audio;
  player.load();
  const p=player.play();
  if(p&&p.catch){ p.catch(()=>{ showContinue(); }); }
}
player.addEventListener('ended', ()=>{ showContinue(); if(cur<SLIDES.length-1){ autoAdvTm=setTimeout(()=>nextSlide(), 900); } });
player.addEventListener('error', ()=>{ showContinue(); });
player.addEventListener('play', ()=>setPlayIcon(true));
player.addEventListener('pause', ()=>setPlayIcon(false));
player.addEventListener('timeupdate',()=>{
  if(!player.duration) return;
  aFill.style.width=(player.currentTime/player.duration*100)+'%';
  const rem=Math.max(0,player.duration-player.currentTime);
  aTime.textContent=fmt(rem);
});
function showContinue(){ btnNext.classList.add('show'); }
function toggleAudio(){ if(player.paused) player.play().catch(()=>{}); else player.pause(); }
function skipAudio(){ player.pause(); showContinue(); }
function seekAudio(e){ if(!player.duration) return; const r=e.currentTarget.getBoundingClientRect(); player.currentTime=((e.clientX-r.left)/r.width)*player.duration; }
function setPlayIcon(p){ document.getElementById('i-play').style.display=p?'none':'block'; document.getElementById('i-pause').style.display=p?'block':'none'; }
function fmt(s){ const m=Math.floor(s/60),sec=Math.floor(s%60); return m+':'+(sec<10?'0':'')+sec; }

document.addEventListener('keydown', e=>{
  if(document.getElementById('entry').classList.contains('hide')){
    if(e.key==='ArrowRight') nextSlide();
    if(e.key==='ArrowLeft') prevSlide();
  }
});

build();
</script>
</body>
</html>
